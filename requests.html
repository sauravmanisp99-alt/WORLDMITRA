<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Requests - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8ff;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 25px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 20px;
    }

    .request-card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .info h2 {
      font-size: 18px;
      margin-bottom: 5px;
      word-break: break-word;
    }

    .country {
      color: #667085;
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      min-width: 70px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .accept {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #e53935;
      color: white;
    }

    .empty {
      background: white;
      padding: 35px 20px;
      border-radius: 16px;
      text-align: center;
      color: #667085;
    }

    .back {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 20px;
      padding: 13px;
      background: #111827;
      color: white;
      border-radius: 10px;
      font-weight: bold;
    }

    @media (max-width: 500px) {

      .request-card {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .info {
        padding-top: 5px;
      }

      .actions {
        width: 100%;
      }

      .btn {
        flex: 1;
        min-width: 0;
      }

    }
  </style>
</head>

<body>

  <div class="header">
    🌍 WorldMitra
  </div>

  <div class="container">

    <h1>🤝 Connection Requests</h1>

    <p class="subtitle">
      See people who want to connect with you.
    </p>

    <div id="requestsList">
      <div class="empty">
        Loading requests...
      </div>
    </div>

    <a href="profile.html" class="back">
      ← Back to Profile
    </a>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      doc,
      updateDoc,
      deleteDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const requestsList =
      document.getElementById("requestsList");


    // ----------------------------------
    // Get sender's latest profile
    // ----------------------------------

    async function getUserProfile(uid) {

      try {

        const profileRef =
          doc(
            db,
            "users",
            uid
          );

        const profileSnapshot =
          await getDoc(profileRef);


        if (profileSnapshot.exists()) {

          return profileSnapshot.data();

        }

      } catch (error) {

        console.error(
          "Profile load error:",
          error
        );

      }

      return {};

    }


    // ----------------------------------
    // Load Requests
    // ----------------------------------

    async function loadRequests(user) {

      try {

        const requestsQuery = query(
          collection(db, "connectionRequests"),
          where("toUserId", "==", user.uid),
          where("status", "==", "pending")
        );


        const snapshot =
          await getDocs(requestsQuery);


        requestsList.innerHTML = "";


        if (snapshot.empty) {

          requestsList.innerHTML = `
            <div class="empty">
              No connection requests yet. 🌍
            </div>
          `;

          return;

        }


        for (const requestDoc of snapshot.docs) {

          const request =
            requestDoc.data();


          /*
            Get sender profile
          */

          const senderProfile =
            await getUserProfile(
              request.fromUserId
            );


          const senderName =
            senderProfile.name ||
            request.fromName ||
            "WorldMitra User";


          const senderCountry =
            senderProfile.country ||
            request.fromCountry ||
            "Country not available";


          const senderPhoto =
            senderProfile.profileImage ||
            "";


          const card =
            document.createElement("div");

          card.className =
            "request-card";


          // ----------------------------------
          // Avatar
          // ----------------------------------

          const avatar =
            document.createElement("div");

          avatar.className =
            "avatar";


          if (senderPhoto) {

            const image =
              document.createElement("img");

            image.src =
              senderPhoto;

            image.alt =
              "Profile Photo";


            image.onerror =
              function() {

                this.remove();

                avatar.textContent =
                  senderName
                    .charAt(0)
                    .toUpperCase();

              };


            avatar.appendChild(
              image
            );

          } else {

            avatar.textContent =
              senderName
                .charAt(0)
                .toUpperCase();

          }


          // ----------------------------------
          // User information
          // ----------------------------------

          const info =
            document.createElement("div");

          info.className =
            "info";


          const name =
            document.createElement("h2");

          name.textContent =
            senderName;


          const country =
            document.createElement("div");

          country.className =
            "country";

          country.textContent =
            "🌎 " +
            senderCountry;


          info.appendChild(
            name
          );

          info.appendChild(
            country
          );


          // ----------------------------------
          // Action buttons
          // ----------------------------------

          const actions =
            document.createElement("div");

          actions.className =
            "actions";


          const acceptButton =
            document.createElement("button");

          acceptButton.className =
            "btn accept";

          acceptButton.type =
            "button";

          acceptButton.textContent =
            "Accept";


          const rejectButton =
            document.createElement("button");

          rejectButton.className =
            "btn reject";

          rejectButton.type =
            "button";

          rejectButton.textContent =
            "Reject";


          actions.appendChild(
            acceptButton
          );

          actions.appendChild(
            rejectButton
          );


          // ----------------------------------
          // Add everything to card
          // ----------------------------------

          card.appendChild(
            avatar
          );

          card.appendChild(
            info
          );

          card.appendChild(
            actions
          );


          // ----------------------------------
          // ACCEPT
          // ----------------------------------

          acceptButton.addEventListener(
            "click",
            async () => {

              acceptButton.disabled =
                true;

              rejectButton.disabled =
                true;

              acceptButton.textContent =
                "Accepting...";


              try {

                await updateDoc(
                  doc(
                    db,
                    "connectionRequests",
                    requestDoc.id
                  ),
                  {
                    status: "accepted"
                  }
                );


                alert(
                  "Connection accepted! 🎉"
                );


                card.remove();


                /*
                  Check if no requests remain
                */

                if (
                  requestsList.children.length ===
                  0
                ) {

                  requestsList.innerHTML = `
                    <div class="empty">
                      No connection requests yet. 🌍
                    </div>
                  `;

                }


              } catch (error) {

                console.error(
                  "Accept error:",
                  error
                );


                acceptButton.disabled =
                  false;

                rejectButton.disabled =
                  false;

                acceptButton.textContent =
                  "Accept";


                alert(
                  "Could not accept request: " +
                  error.message
                );

              }

            }
          );


          // ----------------------------------
          // REJECT
          // ----------------------------------

          rejectButton.addEventListener(
            "click",
            async () => {

              acceptButton.disabled =
                true;

              rejectButton.disabled =
                true;

              rejectButton.textContent =
                "Rejecting...";


              try {

                await deleteDoc(
                  doc(
                    db,
                    "connectionRequests",
                    requestDoc.id
                  )
                );


                alert(
                  "Request rejected."
                );


                card.remove();


                if (
                  requestsList.children.length ===
                  0
                ) {

                  requestsList.innerHTML = `
                    <div class="empty">
                      No connection requests yet. 🌍
                    </div>
                  `;

                }


              } catch (error) {

                console.error(
                  "Reject error:",
                  error
                );


                acceptButton.disabled =
                  false;

                rejectButton.disabled =
                  false;

                rejectButton.textContent =
                  "Reject";


                alert(
                  "Could not reject request: " +
                  error.message
                );

              }

            }
          );


          requestsList.appendChild(
            card
          );

        }


      } catch (error) {

        console.error(
          "Requests load error:",
          error
        );


        requestsList.innerHTML = `
          <div class="empty">

            Requests load नहीं हो पाए।

            <br><br>

            ${error.message}

          </div>
        `;

      }

    }


    // ----------------------------------
    // Authentication
    // ----------------------------------

    onAuthStateChanged(
      auth,
      (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        loadRequests(
          user
        );

      }
    );

  </script>

</body>
</html>
