<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8ff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 15px rgba(0,0,0,0.08);
    }

    .chat-header {
      background: #4f46e5;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 22px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-size: 18px;
      font-weight: bold;
    }

    .online-status {
      font-size: 13px;
      margin-top: 3px;
    }

    .online {
      color: #22c55e;
    }

    .offline {
      color: #e5e7eb;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 75%;
      padding: 10px 13px;
      border-radius: 15px;
      word-wrap: break-word;
      font-size: 15px;
    }

    .sent {
      align-self: flex-end;
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .received {
      align-self: flex-start;
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: white;
      gap: 8px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 22px;
      outline: none;
      font-size: 15px;
    }

    .input-area button {
      border: none;
      background: #4f46e5;
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .input-area button:hover {
      background: #4338ca;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="chat-header">

      <a href="connections.html" class="back-btn">←</a>

      <div class="user-info">

        <div class="user-name" id="otherUserName">
          Loading...
        </div>

        <span class="online-status offline" id="onlineStatus">
          ⚪ Offline
        </span>

      </div>

    </div>

    <div class="messages" id="messages">
      <div style="text-align:center;color:#888;">
        Loading messages...
      </div>
    </div>

    <div class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button id="sendBtn">➤</button>

    </div>

  </div>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const otherUserNameElement =
      document.getElementById("otherUserName");

    const onlineStatus =
      document.getElementById("onlineStatus");

    const messagesContainer =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");


    let currentUser = null;
    let otherUserId = null;
    let otherUserName = null;


    // Create same chat ID for both users
    function getChatId(userA, userB) {

      return [userA, userB]
        .sort()
        .join("_");

    }


    // Update Online / Offline status
    function updateOnlineStatus(data) {

      if (data.online === true) {

        onlineStatus.textContent = "🟢 Online";

        onlineStatus.className =
          "online-status online";

      } else {

        onlineStatus.textContent = "⚪ Offline";

        onlineStatus.className =
          "online-status offline";

      }

    }


    // Listen to other user's status
    function listenToOtherUserStatus() {

      if (!otherUserId) return;

      const userRef =
        doc(db, "users", otherUserId);

      onSnapshot(userRef, (snapshot) => {

        if (snapshot.exists()) {

          updateOnlineStatus(snapshot.data());

        } else {

          onlineStatus.textContent = "⚪ Offline";

        }

      });

    }


    // Set current user Online
    async function setOnline() {

      if (!currentUser) return;

      try {

        await updateDoc(
          doc(db, "users", currentUser.uid),
          {
            online: true,
            lastSeen: serverTimestamp()
          }
        );

      } catch (error) {

        console.error(
          "Online status error:",
          error
        );

      }

    }


    // Set current user Offline
    async function setOffline() {

      if (!currentUser) return;

      try {

        await updateDoc(
          doc(db, "users", currentUser.uid),
          {
            online: false,
            lastSeen: serverTimestamp()
          }
        );

      } catch (error) {

        console.error(
          "Offline status error:",
          error
        );

      }

    }


    // Load other user's profile
    async function loadOtherUserProfile() {

      if (!otherUserId) return;

      try {

        const userDoc =
          await getDoc(
            doc(db, "users", otherUserId)
          );

        if (userDoc.exists()) {

          const data =
            userDoc.data();

          otherUserName =
            data.name ||
            otherUserName ||
            "WorldMitra User";

          otherUserNameElement.textContent =
            otherUserName;

        }

      } catch (error) {

        console.error(
          "Profile loading error:",
          error
        );

      }

    }


    // Load messages
    function loadMessages() {

      if (!currentUser || !otherUserId) return;

      const chatId =
        getChatId(
          currentUser.uid,
          otherUserId
        );

      const messagesRef =
        collection(
          db,
          "chats",
          chatId,
          "messages"
        );

      const messagesQuery =
        query(
          messagesRef,
          orderBy("createdAt", "asc")
        );


      onSnapshot(
        messagesQuery,
        (snapshot) => {

          messagesContainer.innerHTML = "";

          snapshot.forEach((messageDoc) => {

            const data =
              messageDoc.data();

            const messageDiv =
              document.createElement("div");

            messageDiv.classList.add("message");


            if (
              data.senderId ===
              currentUser.uid
            ) {

              messageDiv.classList.add("sent");

            } else {

              messageDiv.classList.add("received");

            }


            messageDiv.textContent =
              data.text || "";


            messagesContainer.appendChild(
              messageDiv
            );

          });


          messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

        },
        (error) => {

          console.error(
            "Messages loading error:",
            error
          );

          messagesContainer.innerHTML =
            `<div style="text-align:center;color:red;">
              Unable to load messages
            </div>`;

        }
      );

    }


    // Send message
    async function sendMessage() {

      const text =
        messageInput.value.trim();

      if (
        !text ||
        !currentUser ||
        !otherUserId
      ) {

        return;

      }


      const chatId =
        getChatId(
          currentUser.uid,
          otherUserId
        );


      try {

        await addDoc(
          collection(
            db,
            "chats",
            chatId,
            "messages"
          ),
          {
            senderId: currentUser.uid,
            receiverId: otherUserId,
            text: text,
            createdAt: serverTimestamp()
          }
        );


        messageInput.value = "";

        messageInput.focus();

      } catch (error) {

        console.error(
          "Message sending error:",
          error
        );

        alert(
          "Message send nahi hua."
        );

      }

    }


    // Send button
    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    // Enter key
    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );


    // Authentication
    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser = user;


        // Current user online
        await setOnline();


        // When leaving chat
        window.addEventListener(
          "beforeunload",
          setOffline
        );


        // Get other user's ID
        const params =
          new URLSearchParams(
            window.location.search
          );


        otherUserId =
          params.get("uid");

        otherUserName =
          params.get("name");


        if (!otherUserId) {

          alert(
            "User information not found."
          );

          return;

        }


        otherUserNameElement.textContent =
          otherUserName ||
          "WorldMitra User";


        // Load profile
        await loadOtherUserProfile();


        // Listen to Online / Offline
        listenToOtherUserStatus();


        // Load messages
        loadMessages();

      }
    );

  </script>

</body>
</html>
