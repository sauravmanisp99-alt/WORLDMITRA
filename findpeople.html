<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find People - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8ff;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 25px auto;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .search-box h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .search-box p {
      color: #667085;
      margin-bottom: 15px;
    }

    .search-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: #2563eb;
    }

    .user-card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .user-info {
      flex: 1;
    }

    .user-info h2 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .country {
      color: #667085;
      font-size: 14px;
    }

    .bio {
      color: #555;
      line-height: 1.5;
      margin-top: 12px;
    }

    .interests {
      background: #eef4ff;
      padding: 10px;
      border-radius: 9px;
      margin-top: 10px;
      color: #333;
      font-size: 14px;
      line-height: 1.4;
    }

    .connect-btn {
      border: none;
      background: #2563eb;
      color: white;
      padding: 11px 14px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
      width: 100%;
    }

    .connect-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .connected {
      background: #16a34a !important;
    }

    .requested {
      background: #f59e0b !important;
    }

    .incoming {
      background: #7c3aed !important;
    }

    .empty {
      text-align: center;
      color: #667085;
      padding: 30px;
      background: white;
      border-radius: 15px;
    }

    .home-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 20px;
      padding: 13px;
      background: #111827;
      color: white;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    🌍 WorldMitra
  </div>

  <div class="container">

    <div class="search-box">

      <h1>👥 Find People</h1>

      <p>
        Discover people and make new connections around the world.
      </p>

      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search by name or country..."
      >

    </div>

    <div id="usersList">

      <div class="empty">
        Loading people...
      </div>

    </div>

    <a href="profile.html" class="home-btn">
      ← Back to Profile
    </a>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      addDoc,
      query,
      where
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const usersList =
      document.getElementById("usersList");

    const searchInput =
      document.getElementById("searchInput");


    let allUsers = [];

    let currentUser = null;

    let currentUserProfile = null;

    /*
      Store request status.

      Key format:
      targetUserId

      Value:
      pending-sent
      pending-received
      accepted
    */

    let connectionStatuses = new Map();


    /*
      Load current user's profile
    */

    async function loadCurrentUserProfile() {

      try {

        const profileRef =
          query(
            collection(db, "users"),
            where("uid", "==", currentUser.uid)
          );

        const snapshot =
          await getDocs(profileRef);


        if (!snapshot.empty) {

          currentUserProfile =
            snapshot.docs[0].data();

        }

      } catch (error) {

        console.error(
          "Current profile load error:",
          error
        );

      }

    }


    /*
      Load all connection/request statuses
    */

    async function loadConnectionStatuses() {

      connectionStatuses =
        new Map();


      try {

        /*
          Requests sent by current user
        */

        const sentQuery =
          query(
            collection(
              db,
              "connectionRequests"
            ),
            where(
              "fromUserId",
              "==",
              currentUser.uid
            )
          );


        const sentSnapshot =
          await getDocs(sentQuery);


        sentSnapshot.forEach(
          (requestDoc) => {

            const data =
              requestDoc.data();


            if (
              data.status ===
              "accepted"
            ) {

              connectionStatuses.set(
                data.toUserId,
                "accepted"
              );

            } else if (
              data.status ===
              "pending"
            ) {

              connectionStatuses.set(
                data.toUserId,
                "pending-sent"
              );

            }

          }
        );


        /*
          Requests received by current user
        */

        const receivedQuery =
          query(
            collection(
              db,
              "connectionRequests"
            ),
            where(
              "toUserId",
              "==",
              currentUser.uid
            )
          );


        const receivedSnapshot =
          await getDocs(receivedQuery);


        receivedSnapshot.forEach(
          (requestDoc) => {

            const data =
              requestDoc.data();


            if (
              data.status ===
              "accepted"
            ) {

              connectionStatuses.set(
                data.fromUserId,
                "accepted"
              );

            } else if (
              data.status ===
              "pending"
            ) {

              connectionStatuses.set(
                data.fromUserId,
                "pending-received"
              );

            }

          }
        );


      } catch (error) {

        console.error(
          "Connection status error:",
          error
        );

      }

    }


    /*
      Send connection request
    */

    async function sendConnectionRequest(
      targetUser,
      button
    ) {

      if (!currentUser) {

        alert(
          "Please login first."
        );

        return;

      }


      if (!targetUser.uid) {

        alert(
          "This user's profile is missing a UID."
        );

        return;

      }


      if (
        targetUser.uid ===
        currentUser.uid
      ) {

        alert(
          "You cannot connect with yourself."
        );

        return;

      }


      const currentStatus =
        connectionStatuses.get(
          targetUser.uid
        );


      /*
        Prevent duplicate actions
      */

      if (
        currentStatus ===
        "accepted"
      ) {

        button.textContent =
          "Connected";

        return;

      }


      if (
        currentStatus ===
        "pending-sent"
      ) {

        button.textContent =
          "Requested";

        return;

      }


      if (
        currentStatus ===
        "pending-received"
      ) {

        alert(
          "This person has already sent you a request. Check Connection Requests."
        );

        button.textContent =
          "Accept in Requests";

        button.classList.add(
          "incoming"
        );

        return;

      }


      button.disabled =
        true;

      button.textContent =
        "Sending...";


      try {

        /*
          Double-check in Firebase
        */

        const existingQuery =
          query(
            collection(
              db,
              "connectionRequests"
            ),

            where(
              "fromUserId",
              "==",
              currentUser.uid
            ),

            where(
              "toUserId",
              "==",
              targetUser.uid
            )
          );


        const existingSnapshot =
          await getDocs(
            existingQuery
          );


        if (
          !existingSnapshot.empty
        ) {

          button.textContent =
            "Requested";

          button.classList.add(
            "requested"
          );

          connectionStatuses.set(
            targetUser.uid,
            "pending-sent"
          );

          return;

        }


        /*
          Create new request
        */

        await addDoc(
          collection(
            db,
            "connectionRequests"
          ),
          {

            fromUserId:
              currentUser.uid,

            fromName:
              currentUserProfile?.name ||
              currentUser.displayName ||
              "WorldMitra User",

            fromEmail:
              currentUser.email ||
              "",

            fromCountry:
              currentUserProfile?.country ||
              "",

            toUserId:
              targetUser.uid,

            toName:
              targetUser.name ||
              "WorldMitra User",

            toCountry:
              targetUser.country ||
              "",

            status:
              "pending",

            createdAt:
              new Date()

          }
        );


        connectionStatuses.set(
          targetUser.uid,
          "pending-sent"
        );


        button.textContent =
          "Requested";

        button.classList.add(
          "requested"
        );


        alert(
          "Connection request sent! 🎉"
        );


      } catch (error) {

        console.error(
          "Connection request error:",
          error
        );


        alert(
          "Request send नहीं हुई: " +
          error.message
        );


        button.disabled =
          false;

        button.textContent =
          "Connect";

      }

    }


    /*
      Get button state
    */

    function getButtonState(
      user
    ) {

      const status =
        connectionStatuses.get(
          user.uid
        );


      if (
        status ===
        "accepted"
      ) {

        return {
          text: "Connected",
          disabled: true,
          className: "connected"
        };

      }


      if (
        status ===
        "pending-sent"
      ) {

        return {
          text: "Requested",
          disabled: true,
          className: "requested"
        };

      }


      if (
        status ===
        "pending-received"
      ) {

        return {
          text: "Accept in Requests",
          disabled: true,
          className: "incoming"
        };

      }


      return {
        text: "Connect",
        disabled: false,
        className: ""
      };

    }


    /*
      Show users
    */

    function showUsers(users) {

      usersList.innerHTML =
        "";


      /*
        Don't show current user
      */

      const otherUsers =
        users.filter(
          (user) =>
            user.uid !==
            currentUser.uid
        );


      if (
        otherUsers.length ===
        0
      ) {

        usersList.innerHTML = `
          <div class="empty">
            No other people found yet. 🌍
          </div>
        `;

        return;

      }


      otherUsers.forEach(
        (user) => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "user-card";


          const firstLetter =
            (
              user.name ||
              "U"
            )
              .charAt(0)
              .toUpperCase();


          const buttonState =
            getButtonState(
              user
            );


          card.innerHTML = `

            <div class="top-row">

              <div class="avatar">

                ${
                  user.profileImage
                    ? `<img
                        src="${user.profileImage}"
                        alt="Profile Photo"
                      >`
                    : firstLetter
                }

              </div>

              <div class="user-info">

                <h2>
                  ${
                    user.name ||
                    "WorldMitra User"
                  }
                </h2>

                <div class="country">
                  🌎 ${
                    user.country ||
                    "Country not available"
                  }
                </div>

              </div>

            </div>


            <div class="bio">

              📝 ${
                user.bio ||
                "No information added yet."
              }

            </div>


            <div class="interests">

              ❤️ ${
                user.interests ||
                "Interests not added yet."
              }

            </div>


            <button
              class="connect-btn ${buttonState.className}"
              ${buttonState.disabled ? "disabled" : ""}
            >

              ${buttonState.text}

            </button>

          `;


          const connectButton =
            card.querySelector(
              ".connect-btn"
            );


          if (
            !buttonState.disabled
          ) {

            connectButton.addEventListener(
              "click",
              () => {

                sendConnectionRequest(
                  user,
                  connectButton
                );

              }
            );

          }


          usersList.appendChild(
            card
          );

        }
      );

    }


    /*
      Load all users
    */

    async function loadUsers() {

      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "users"
            )
          );


        allUsers =
          [];


        snapshot.forEach(
          (userDoc) => {

            const data =
              userDoc.data();


            allUsers.push({

              ...data,

              /*
                Firestore document ID
                is the safest UID fallback
              */

              uid:
                data.uid ||
                userDoc.id

            });

          }
        );


        await loadConnectionStatuses();


        showUsers(
          allUsers
        );


      } catch (error) {

        console.error(
          "Users load error:",
          error
        );


        usersList.innerHTML = `

          <div class="empty">

            People load नहीं हो पाए।

            <br><br>

            ${error.message}

          </div>

        `;

      }

    }


    /*
      Search users
    */

    searchInput.addEventListener(
      "input",
      () => {

        const search =
          searchInput.value
            .toLowerCase()
            .trim();


        const filteredUsers =
          allUsers.filter(
            (user) => {

              const name =
                (
                  user.name ||
                  ""
                )
                  .toLowerCase();


              const country =
                (
                  user.country ||
                  ""
                )
                  .toLowerCase();


              const bio =
                (
                  user.bio ||
                  ""
                )
                  .toLowerCase();


              const interests =
                (
                  user.interests ||
                  ""
                )
                  .toLowerCase();


              return (

                name.includes(
                  search
                ) ||

                country.includes(
                  search
                ) ||

                bio.includes(
                  search
                ) ||

                interests.includes(
                  search
                )

              );

            }
          );


        showUsers(
          filteredUsers
        );

      }
    );


    /*
      Authentication
    */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser =
          user;


        await loadCurrentUserProfile();

        await loadUsers();

      }
    );

  </script>

</body>
</html>
