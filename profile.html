<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8ff;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .profile-card {
      width: 92%;
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 30px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 18px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 40px;
      font-weight: bold;
      border: 3px solid #e5e7eb;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-btn {
      display: inline-block;
      padding: 10px 16px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .photo-btn:hover {
      background: #1d4ed8;
    }

    #photoInput {
      display: none;
    }

    .photo-status {
      color: #667085;
      font-size: 13px;
      margin-top: -12px;
      margin-bottom: 18px;
      min-height: 18px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .email {
      color: #667085;
      margin-bottom: 10px;
    }

    .country {
      color: #667085;
      margin-bottom: 18px;
    }

    .bio {
      color: #555;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .interests {
      background: #eef4ff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 25px;
      color: #333;
      line-height: 1.5;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .logout {
      background: #e53935;
    }

    .loading {
      color: #667085;
    }

    .save-status {
      margin-top: 12px;
      font-size: 14px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="header">
    🌍 WorldMitra
  </div>

  <div class="profile-card">

    <!-- Profile Photo -->
    <div class="avatar-wrapper">

      <div class="avatar" id="avatar">
        <span id="avatarLetter">W</span>

        <img
          id="profileImage"
          alt="Profile Photo"
        >
      </div>

    </div>

    <label for="photoInput" class="photo-btn">
      📷 Change Profile Photo
    </label>

    <input
      type="file"
      id="photoInput"
      accept="image/jpeg,image/png,image/webp"
    >

    <div
      class="photo-status"
      id="photoStatus"
    ></div>

    <h1 id="userName">
      My Profile
    </h1>

    <p class="email" id="userEmail">
      Loading...
    </p>

    <p class="country" id="userCountry">
      🌍 Country not added
    </p>

    <p class="bio" id="userBio">
      Welcome to WorldMitra!
    </p>

    <div class="interests" id="userInterests">
      ❤️ Interests not added
    </div>

    <div
      class="save-status"
      id="saveStatus"
    ></div>


    <a href="index.html" class="btn">
      🏠 Home
    </a>

    <a href="findpeople.html" class="btn">
      👥 Find People
    </a>

    <a href="requests.html" class="btn">
      🤝 Connection Requests
    </a>

    <a href="connections.html" class="btn">
      🤝 My Connections
    </a>

    <a href="editprofile.html" class="btn">
      ✏️ Edit Profile
    </a>

    <button id="logoutBtn" class="btn logout">
      🚪 Logout
    </button>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc,
      updateDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    const userName =
      document.getElementById("userName");

    const userEmail =
      document.getElementById("userEmail");

    const userCountry =
      document.getElementById("userCountry");

    const userBio =
      document.getElementById("userBio");

    const userInterests =
      document.getElementById("userInterests");

    const avatar =
      document.getElementById("avatar");

    const avatarLetter =
      document.getElementById("avatarLetter");

    const profileImage =
      document.getElementById("profileImage");

    const photoInput =
      document.getElementById("photoInput");

    const photoStatus =
      document.getElementById("photoStatus");

    const saveStatus =
      document.getElementById("saveStatus");

    const logoutBtn =
      document.getElementById("logoutBtn");


    let currentUser = null;


    /*
      Load profile
    */

    async function loadProfile(user) {

      try {

        const profileRef =
          doc(
            db,
            "users",
            user.uid
          );


        const profileSnapshot =
          await getDoc(profileRef);


        userEmail.textContent =
          user.email || "";


        if (profileSnapshot.exists()) {

          const data =
            profileSnapshot.data();


          const name =
            data.name ||
            user.displayName ||
            "WorldMitra User";


          userName.textContent =
            name;


          avatarLetter.textContent =
            name
              .charAt(0)
              .toUpperCase();


          userCountry.textContent =
            "🌍 " +
            (
              data.country ||
              "Country not added"
            );


          userBio.textContent =
            data.bio ||
            "Welcome to WorldMitra! Connect with people, make new friends and discover the world.";


          userInterests.textContent =
            "❤️ Interests: " +
            (
              data.interests ||
              "Not added yet"
            );


          /*
            Existing profile image
          */

          if (data.profileImage) {

            profileImage.src =
              data.profileImage;

            profileImage.style.display =
              "block";

            avatarLetter.style.display =
              "none";

          }

        } else {

          userName.textContent =
            user.displayName ||
            "WorldMitra User";


          avatarLetter.textContent =
            userName.textContent
              .charAt(0)
              .toUpperCase();

        }


      } catch (error) {

        console.error(
          "Profile loading error:",
          error
        );


        userName.textContent =
          "WorldMitra User";

        userEmail.textContent =
          user.email || "";

        userCountry.textContent =
          "🌍 Country not available";

        userBio.textContent =
          "Unable to load profile.";

        userInterests.textContent =
          "❤️ Interests not available";

      }

    }


    /*
      Compress profile image
    */

    function compressImage(file) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();


          reader.onload =
            function(event) {

              const image =
                new Image();


              image.onload =
                function() {

                  const maxSize =
                    500;


                  let width =
                    image.width;

                  let height =
                    image.height;


                  if (width > height) {

                    if (width > maxSize) {

                      height =
                        Math.round(
                          height *
                          maxSize /
                          width
                        );

                      width =
                        maxSize;

                    }

                  } else {

                    if (height > maxSize) {

                      width =
                        Math.round(
                          width *
                          maxSize /
                          height
                        );

                      height =
                        maxSize;

                    }

                  }


                  const canvas =
                    document.createElement(
                      "canvas"
                    );


                  canvas.width =
                    width;

                  canvas.height =
                    height;


                  const context =
                    canvas.getContext(
                      "2d"
                    );


                  context.drawImage(
                    image,
                    0,
                    0,
                    width,
                    height
                  );


                  const compressed =
                    canvas.toDataURL(
                      "image/jpeg",
                      0.75
                    );


                  resolve(
                    compressed
                  );

                };


              image.onerror =
                function() {

                  reject(
                    new Error(
                      "Image could not be loaded."
                    )
                  );

                };


              image.src =
                event.target.result;

            };


          reader.onerror =
            function() {

              reject(
                new Error(
                  "Image could not be read."
                )
              );

            };


          reader.readAsDataURL(file);

        }
      );

    }


    /*
      Change profile photo
    */

    photoInput.addEventListener(
      "change",
      async function() {

        const file =
          this.files[0];


        if (!file) {
          return;
        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          alert(
            "Please select an image file."
          );

          photoInput.value = "";

          return;

        }


        if (
          file.size >
          10 * 1024 * 1024
        ) {

          alert(
            "Image बहुत बड़ी है। कृपया 10 MB से छोटी photo चुनें।"
          );

          photoInput.value = "";

          return;

        }


        try {

          photoStatus.textContent =
            "Preparing photo...";

          saveStatus.textContent =
            "";


          const compressedImage =
            await compressImage(
              file
            );


          /*
            Show image immediately
          */

          profileImage.src =
            compressedImage;

          profileImage.style.display =
            "block";

          avatarLetter.style.display =
            "none";


          photoStatus.textContent =
            "Saving photo...";


          if (!currentUser) {

            photoStatus.textContent =
              "Please login first.";

            return;

          }


          const profileRef =
            doc(
              db,
              "users",
              currentUser.uid
            );


          const profileSnapshot =
            await getDoc(
              profileRef
            );


          if (profileSnapshot.exists()) {

            await updateDoc(
              profileRef,
              {
                profileImage:
                  compressedImage
              }
            );

          } else {

            await setDoc(
              profileRef,
              {
                profileImage:
                  compressedImage,
                email:
                  currentUser.email || ""
              },
              {
                merge: true
              }
            );

          }


          photoStatus.textContent =
            "✅ Profile photo saved.";

        } catch (error) {

          console.error(
            "Photo save error:",
            error
          );


          photoStatus.textContent =
            "❌ Photo save नहीं हो पाया.";

          alert(
            "Profile photo save नहीं हो पाया। कृपया फिर से try करें।"
          );

        }

      }
    );


    /*
      Authentication
    */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser =
          user;


        await loadProfile(
          user
        );

      }
    );


    /*
      Logout
    */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await signOut(
            auth
          );


          window.location.href =
            "login.html";


        } catch (error) {

          console.error(
            error
          );


          alert(
            "Logout नहीं हो पाया: " +
            error.message
          );

        }

      }
    );

  </script>

</body>
</html>
