<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WorldMitra - Login / Signup</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.2);
      text-align: center;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
      color: #1677ff;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    h2 {
      margin-bottom: 18px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1677ff;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1677ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    button:hover {
      background: #075fd4;
    }

    button:disabled {
      background: #9bbef0;
      cursor: not-allowed;
    }

    .secondary {
      background: #eee;
      color: #333;
    }

    .secondary:hover {
      background: #ddd;
    }

    #otp-section {
      display: none;
    }

    #recaptcha-container {
      margin: 15px 0;
      display: flex;
      justify-content: center;
    }

    .message {
      min-height: 24px;
      margin: 10px 0;
      font-size: 14px;
      font-weight: bold;
    }

    .success {
      color: #159447;
    }

    .error {
      color: #d93025;
    }

    .info {
      color: #555;
    }

    .small-text {
      font-size: 13px;
      color: #777;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🌍 WorldMitra</div>

    <p class="subtitle">
      Connect with the world.<br>
      Meet people, make connections and share cultures.
    </p>

    <!-- PHONE SECTION -->

    <div id="phone-section">

      <h2>Login / Signup</h2>

      <input
        type="tel"
        id="phone"
        placeholder="+91 9876543210"
        autocomplete="tel"
      >

      <div id="recaptcha-container"></div>

      <button id="send-otp-btn">
        📱 Send OTP
      </button>

      <div id="phone-message" class="message"></div>

      <p class="small-text">
        Enter your mobile number with country code.<br>
        Example: +91 9876543210
      </p>

    </div>


    <!-- OTP SECTION -->

    <div id="otp-section">

      <h2>Verify OTP</h2>

      <p id="otp-info" class="small-text"></p>

      <br>

      <input
        type="number"
        id="otp"
        placeholder="Enter 6-digit OTP"
        inputmode="numeric"
        autocomplete="one-time-code"
      >

      <button id="verify-otp-btn">
        ✅ Verify OTP
      </button>

      <button id="change-number-btn" class="secondary">
        ← Change Number
      </button>

      <div id="otp-message" class="message"></div>

    </div>

  </div>


  <!-- Firebase Code -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      RecaptchaVerifier,
      signInWithPhoneNumber,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // Firebase Configuration

    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // Elements

    const phoneSection = document.getElementById("phone-section");
    const otpSection = document.getElementById("otp-section");

    const phoneInput = document.getElementById("phone");
    const otpInput = document.getElementById("otp");

    const sendOtpBtn = document.getElementById("send-otp-btn");
    const verifyOtpBtn = document.getElementById("verify-otp-btn");
    const changeNumberBtn = document.getElementById("change-number-btn");

    const phoneMessage = document.getElementById("phone-message");
    const otpMessage = document.getElementById("otp-message");
    const otpInfo = document.getElementById("otp-info");

    let confirmationResult = null;
    let recaptchaVerifier = null;


    // If already logged in, go to profile

    onAuthStateChanged(auth, (user) => {

      if (user) {
        window.location.href = "profile.html";
      }

    });


    // Create reCAPTCHA

    function createRecaptcha() {

      if (recaptchaVerifier) {
        try {
          recaptchaVerifier.clear();
        } catch (error) {
          console.log(error);
        }
      }

      recaptchaVerifier = new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
          size: "normal",

          callback: () => {
            phoneMessage.textContent = "";
          },

          "expired-callback": () => {
            phoneMessage.textContent =
              "reCAPTCHA expired. Please verify again.";

            phoneMessage.className = "message error";
          }
        }
      );

      recaptchaVerifier.render();
    }


    createRecaptcha();


    // Firebase error messages

    function showFirebaseError(error, element) {

      let message = "Something went wrong. Please try again.";

      switch (error.code) {

        case "auth/invalid-phone-number":
          message = "Please enter a valid mobile number.";
          break;

        case "auth/missing-phone-number":
          message = "Please enter your mobile number.";
          break;

        case "auth/too-many-requests":
          message = "Too many attempts. Please try again later.";
          break;

        case "auth/quota-exceeded":
          message = "OTP limit reached. Please try again later.";
          break;

        case "auth/captcha-check-failed":
          message = "reCAPTCHA verification failed. Please try again.";
          break;

        case "auth/unauthorized-domain":
          message = "This website domain is not authorized in Firebase.";
          break;

        default:
          console.log("Firebase Error:", error);
      }

      element.textContent = message;
      element.className = "message error";
    }


    // SEND OTP

    sendOtpBtn.addEventListener("click", async () => {

      let phoneNumber = phoneInput.value.trim();

      phoneMessage.textContent = "";
      phoneMessage.className = "message";


      // If user enters 10 digit Indian number

      if (/^[0-9]{10}$/.test(phoneNumber)) {
        phoneNumber = "+91" + phoneNumber;
      }


      if (!phoneNumber.startsWith("+")) {

        phoneMessage.textContent =
          "Please enter number with country code, e.g. +91 9876543210";

        phoneMessage.className = "message error";

        return;
      }


      sendOtpBtn.disabled = true;
      sendOtpBtn.textContent = "Sending OTP...";


      try {

        confirmationResult =
          await signInWithPhoneNumber(
            auth,
            phoneNumber,
            recaptchaVerifier
          );

        phoneSection.style.display = "none";
        otpSection.style.display = "block";

        otpInfo.textContent =
          "OTP sent to " + phoneNumber;

        otpMessage.textContent =
          "Please enter the 6-digit OTP.";

        otpMessage.className = "message success";

      } catch (error) {

        showFirebaseError(error, phoneMessage);

        createRecaptcha();

      } finally {

        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = "📱 Send OTP";

      }

    });
    // VERIFY OTP

    verifyOtpBtn.addEventListener("click", async () => {

      const otp = otpInput.value.trim();

      otpMessage.textContent = "";
      otpMessage.className = "message";


      if (!otp) {

        otpMessage.textContent =
          "Please enter the OTP.";

        otpMessage.className = "message error";

        return;
      }


      if (!/^[0-9]{6}$/.test(otp)) {

        otpMessage.textContent =
          "OTP must be 6 digits.";

        otpMessage.className = "message error";

        return;
      }


      verifyOtpBtn.disabled = true;
      verifyOtpBtn.textContent = "Verifying...";


      try {

        const result =
          await confirmationResult.confirm(otp);

        const user = result.user;

        otpMessage.textContent =
          "Login successful!";

        otpMessage.className = "message success";


        console.log("User UID:", user.uid);
        console.log("Phone:", user.phoneNumber);


        // Go to Profile

        setTimeout(() => {
          window.location.href = "profile.html";
        }, 500);


      } catch (error) {

        let message =
          "Invalid OTP. Please try again.";

        switch (error.code) {

          case "auth/invalid-verification-code":
            message =
              "Wrong OTP. Please enter the correct OTP.";
            break;

          case "auth/code-expired":
            message =
              "OTP expired. Please request a new OTP.";
            break;

          case "auth/too-many-requests":
            message =
              "Too many attempts. Please try again later.";
            break;

          default:
            console.log("OTP Error:", error);

        }

        otpMessage.textContent = message;
        otpMessage.className = "message error";

      } finally {

        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = "✅ Verify OTP";

      }

    });


    // CHANGE NUMBER

    changeNumberBtn.addEventListener("click", () => {

      otpInput.value = "";

      otpMessage.textContent = "";
      otpMessage.className = "message";

      phoneMessage.textContent = "";
      phoneMessage.className = "message";

      confirmationResult = null;

      otpSection.style.display = "none";
      phoneSection.style.display = "block";

      createRecaptcha();

    });


    // Enter key support

    phoneInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        sendOtpBtn.click();
      }

    });


    otpInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        verifyOtpBtn.click();
      }

    });

  </script>

</body>
</html>
