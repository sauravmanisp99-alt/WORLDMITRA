<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f9;
      min-height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #2563eb;
      color: white;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 24px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      color: #2563eb;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      margin-top: 3px;
    }

    .call-buttons {
      display: flex;
      gap: 8px;
    }

    .call-buttons a {
      color: white;
      text-decoration: none;
      font-size: 20px;
      padding: 5px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #f8fafc;
    }

    .message {
      max-width: 75%;
      padding: 10px 13px;
      margin-bottom: 10px;
      border-radius: 15px;
      word-wrap: break-word;
      position: relative;
    }

    .sent {
      margin-left: auto;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .received {
      margin-right: auto;
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 11px;
      margin-left: 8px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: white;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 22px;
      outline: none;
      font-size: 15px;
    }

    .send-btn {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty-message {
      text-align: center;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="chat-header">

      <a href="profile.html" class="back-btn">←</a>

      <div class="avatar" id="avatar">
        🌍
      </div>

      <div class="user-info">
        <div class="user-name" id="userName">
          Loading...
        </div>

        <div class="status" id="userStatus">
          ⚪ Offline
        </div>
      </div>

      <div class="call-buttons">

        <a id="voiceCallBtn" href="#" title="Voice Call">
          📞
        </a>

        <a id="videoCallBtn" href="#" title="Video Call">
          📹
        </a>

      </div>

    </div>

    <div class="messages" id="messages">
      <div class="empty-message">
        Loading messages...
      </div>
    </div>

    <div class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button
        class="send-btn"
        id="sendBtn"
      >
        ➤
      </button>

    </div>

  </div>


  <script type="module">

    /* ================================
       FIREBASE IMPORTS
    ================================= */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      deleteDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      getDatabase,
      ref,
      onValue,
      onDisconnect,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /* ================================
       FIREBASE CONFIG
    ================================= */

    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    /* ================================
       INITIALIZE FIREBASE
    ================================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const realtimeDb = getDatabase(app);


    /* ================================
       GET HTML ELEMENTS
    ================================= */

    const userNameElement =
      document.getElementById("userName");

    const userStatusElement =
      document.getElementById("userStatus");

    const avatarElement =
      document.getElementById("avatar");

    const messagesElement =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");

    const voiceCallBtn =
      document.getElementById("voiceCallBtn");

    const videoCallBtn =
      document.getElementById("videoCallBtn");


    /* ================================
       GET OTHER USER DETAILS
    ================================= */

    const urlParams =
      new URLSearchParams(window.location.search);

    const otherUserId =
      urlParams.get("uid");

    const otherUserName =
      urlParams.get("name") || "WorldMitra User";


    /* ================================
       VARIABLES
    ================================= */

    let currentUser = null;

    let chatId = null;

    let unsubscribeMessages = null;


    /* ================================
       DISPLAY USER
    ================================= */

    userNameElement.textContent =
      otherUserName;

    if (otherUserName) {

      avatarElement.textContent =
        otherUserName.charAt(0).toUpperCase();

    }


    /* ================================
       AUTH CHECK
    ================================= */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href =
          "signup.html";

        return;

      }

      currentUser = user;


      /* ================================
         SET CURRENT USER ONLINE
      ================================= */

      await setUserOnline();


      /* ================================
         CHECK OTHER USER
      ================================= */

      if (!otherUserId) {

        messagesElement.innerHTML = `
          <div class="empty-message">
            No user selected.
          </div>
        `;

        sendBtn.disabled = true;

        return;

      }


      /* ================================
         CREATE CHAT ID
      ================================= */

      chatId =
        [currentUser.uid, otherUserId]
          .sort()
          .join("_");


      /* ================================
         LISTEN TO OTHER USER STATUS
      ================================= */

      listenToOtherUserStatus();


      /* ================================
         CALL BUTTONS
      ================================= */

      voiceCallBtn.href =
        "call.html?uid=" +
        encodeURIComponent(otherUserId) +
        "&name=" +
        encodeURIComponent(otherUserName);


      videoCallBtn.href =
        "video-call.html?uid=" +
        encodeURIComponent(otherUserId) +
        "&name=" +
        encodeURIComponent(otherUserName);


      /* ================================
         LOAD MESSAGES
      ================================= */

      loadMessages();

    });


    /* ================================
       SET USER ONLINE
    ================================= */

    async function setUserOnline() {

      if (!currentUser) return;

      const userStatusRef =
        ref(
          realtimeDb,
          "status/" + currentUser.uid
        );


      try {

        await set(userStatusRef, {

          online: true,

          lastSeen: Date.now()

        });


        onDisconnect(userStatusRef)
          .set({

            online: false,

            lastSeen: Date.now()

          });

      } catch (error) {

        console.error(
          "Online status error:",
          error
        );

      }

    }


    /* ================================
       LISTEN OTHER USER STATUS
    ================================= */

    function listenToOtherUserStatus() {

      const statusRef =
        ref(
          realtimeDb,
          "status/" + otherUserId
        );


      onValue(statusRef, (snapshot) => {

        const data =
          snapshot.val();


        if (
          data &&
          data.online === true
        ) {

          showOnline();

        } else {

          showOffline();

        }

      });

    }


    /* ================================
       SHOW ONLINE
    ================================= */

    function showOnline() {

      userStatusElement.textContent =
        "🟢 Online";

    }


    /* ================================
       SHOW OFFLINE
    ================================= */

    function showOffline() {

      userStatusElement.textContent =
        "⚪ Offline";

    }


    /* ================================
       LOAD MESSAGES
    ================================= */

    function loadMessages() {

      const messagesRef =
        collection(
          db,
          "chats",
          chatId,
          "messages"
        );


      const messagesQuery =
        query(
          messagesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        );


      if (unsubscribeMessages) {

        unsubscribeMessages();

      }


      unsubscribeMessages =
        onSnapshot(
          messagesQuery,
          (snapshot) => {

            messagesElement.innerHTML = "";


            if (snapshot.empty) {

              messagesElement.innerHTML = `
                <div class="empty-message">
                  Start a conversation 👋
                </div>
              `;

              return;

            }


            snapshot.forEach((messageDoc) => {

              const data =
                messageDoc.data();


              const messageDiv =
                document.createElement("div");


              const isSent =
                data.senderId === currentUser.uid;


              messageDiv.className =
                "message " +
                (
                  isSent
                    ? "sent"
                    : "received"
                );


              const textDiv =
                document.createElement("div");

              textDiv.textContent =
                data.text || "";


              const timeDiv =
                document.createElement("div");

              timeDiv.className =
                "message-time";


              if (data.createdAt) {

                try {

                  const date =
                    data.createdAt.toDate();

                  timeDiv.textContent =
                    date.toLocaleTimeString(
                      [],
                      {
                        hour: "2-digit",
                        minute: "2-digit"
                      }
                    );

                } catch (error) {

                  timeDiv.textContent = "";

                }

              }


              if (isSent) {

                const deleteButton =
                  document.createElement("button");

                deleteButton.className =
                  "delete-btn";

                deleteButton.textContent =
                  "Delete";

                deleteButton.onclick =
                  () => deleteMessage(
                    messageDoc.id
                  );

                timeDiv.appendChild(
                  deleteButton
                );

              }


              messageDiv.appendChild(
                textDiv
              );

              messageDiv.appendChild(
                timeDiv
              );


              messagesElement.appendChild(
                messageDiv
              );

            });


            messagesElement.scrollTop =
              messagesElement.scrollHeight;

          },

          (error) => {

            console.error(
              "Message loading error:",
              error
            );

            messagesElement.innerHTML = `
              <div class="empty-message">
                Unable to load messages.
              </div>
            `;

          }
        );

    }


    /* ================================
       SEND MESSAGE
    ================================= */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) return;

      if (!currentUser) return;

      if (!otherUserId) return;


      sendBtn.disabled = true;


      try {

        await addDoc(

          collection(
            db,
            "chats",
            chatId,
            "messages"
          ),

          {

            senderId:
              currentUser.uid,

            receiverId:
              otherUserId,

            text:
              text,

            createdAt:
              serverTimestamp()

          }

        );


        messageInput.value = "";


      } catch (error) {

        console.error(
          "Send message error:",
          error
        );

        alert(
          "Message send nahi ho paya."
        );

      }


      sendBtn.disabled = false;

      messageInput.focus();

    }


    /* ================================
       DELETE MESSAGE
    ================================= */

    async function deleteMessage(
      messageId
    ) {

      try {

        await deleteDoc(

          doc(
            db,
            "chats",
            chatId,
            "messages",
            messageId
          )

        );

      } catch (error) {

        console.error(
          "Delete message error:",
          error
        );

        alert(
          "Message delete nahi ho paya."
        );

      }

    }


    /* ================================
       SEND BUTTON
    ================================= */

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /* ================================
       ENTER KEY
    ================================= */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* ================================
       PAGE CLOSE
    ================================= */

    window.addEventListener(
      "beforeunload",
      () => {

        if (!currentUser) return;

        const userStatusRef =
          ref(
            realtimeDb,
            "status/" + currentUser.uid
          );


        set(
          userStatusRef,
          {

            online: false,

            lastSeen: Date.now()

          }
        );

      }
    );

  </script>

</body>
</html>
