<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Call - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #111827;
      color: white;
      padding: 15px;
    }

    .call-container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .top-bar {
      text-align: center;
      padding: 15px;
    }

    .top-bar h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .status {
      color: #cbd5e1;
      font-size: 15px;
    }

    .video-area {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      min-height: 500px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }

    #remoteVideo {
      width: 100%;
      height: 500px;
      object-fit: cover;
      background: #000;
    }

    #localVideo {
      position: absolute;
      right: 15px;
      bottom: 15px;
      width: 180px;
      height: 130px;
      object-fit: cover;
      background: #222;
      border: 2px solid white;
      border-radius: 12px;
      z-index: 5;
    }

    .no-video {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #cbd5e1;
      font-size: 18px;
      z-index: 1;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 20px 0;
    }

    button {
      border: none;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn,
    #acceptBtn {
      background: #16a34a;
      color: white;
    }

    #rejectBtn,
    #endBtn {
      background: #dc2626;
      color: white;
    }

    #muteBtn {
      background: #f59e0b;
      color: white;
    }

    #cameraBtn {
      background: #2563eb;
      color: white;
    }

    button:disabled {
      background: #6b7280;
      cursor: not-allowed;
    }

    .incoming {
      display: none;
      background: white;
      color: #172033;
      padding: 20px;
      border-radius: 18px;
      text-align: center;
      margin: 15px auto;
      max-width: 450px;
    }

    .incoming h2 {
      margin-bottom: 8px;
    }

    .incoming p {
      color: #667085;
      margin-bottom: 15px;
    }

    .back {
      display: block;
      text-align: center;
      text-decoration: none;
      color: white;
      background: #374151;
      padding: 13px;
      border-radius: 10px;
      margin-top: 5px;
    }

    @media (max-width: 600px) {

      .video-area {
        min-height: 400px;
      }

      #remoteVideo {
        height: 400px;
      }

      #localVideo {
        width: 120px;
        height: 90px;
        right: 10px;
        bottom: 10px;
      }

      button {
        padding: 12px 14px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="call-container">

    <div class="top-bar">

      <h1 id="personName">
        🎥 Video Call
      </h1>

      <p class="status" id="status">
        Ready to call
      </p>

    </div>


    <!-- Incoming Call -->

    <div class="incoming" id="incomingBox">

      <h2>
        📹 Incoming Video Call
      </h2>

      <p id="incomingText">
        Someone is calling you.
      </p>

      <div class="controls">

        <button id="acceptBtn">
          ✅ Accept
        </button>

        <button id="rejectBtn">
          ❌ Reject
        </button>

      </div>

    </div>


    <!-- Video Area -->

    <div class="video-area">

      <div class="no-video" id="noVideo">
        📹 Waiting for video...
      </div>

      <video
        id="remoteVideo"
        autoplay
        playsinline>
      </video>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline>
      </video>

    </div>


    <!-- Controls -->

    <div class="controls">

      <button id="startBtn">
        📹 Start Video Call
      </button>

      <button id="muteBtn" disabled>
        🎤 Mute
      </button>

      <button id="cameraBtn" disabled>
        📷 Camera Off
      </button>

      <button id="endBtn" disabled>
        🔴 End Call
      </button>

    </div>


    <a href="connections.html" class="back">
      ← Back to Connections
    </a>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      addDoc,
      onSnapshot,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",

      authDomain:
        "worldmitra-33ca6.firebaseapp.com",

      projectId:
        "worldmitra-33ca6",

      storageBucket:
        "worldmitra-33ca6.firebasestorage.app",

      messagingSenderId:
        "1089520845776",

      appId:
        "1:1089520845776:web:2789654cc6061e7034afd5"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /* Elements */

    const personName =
      document.getElementById("personName");

    const statusText =
      document.getElementById("status");

    const startBtn =
      document.getElementById("startBtn");

    const muteBtn =
      document.getElementById("muteBtn");

    const cameraBtn =
      document.getElementById("cameraBtn");

    const endBtn =
      document.getElementById("endBtn");

    const acceptBtn =
      document.getElementById("acceptBtn");

    const rejectBtn =
      document.getElementById("rejectBtn");

    const incomingBox =
      document.getElementById("incomingBox");

    const incomingText =
      document.getElementById("incomingText");

    const localVideo =
      document.getElementById("localVideo");

    const remoteVideo =
      document.getElementById("remoteVideo");

    const noVideo =
      document.getElementById("noVideo");


    /* Variables */

    let currentUser = null;

    let otherUserId = null;

    let otherUserName =
      "WorldMitra User";

    let localStream = null;

    let peerConnection = null;

    let callDocId = null;

    let callUnsubscribe = null;

    let candidateUnsubscribe = null;

    let incomingUnsubscribe = null;

    let isMuted = false;

    let isCameraOff = false;


    /* WebRTC */

    const servers = {

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        }

      ]

    };


    /* Create unique call ID */

    function getCallId(userA, userB) {

      return [userA, userB]
        .sort()
        .join("_");

    }


    /* Create Peer Connection */

    async function createPeerConnection(
      callId,
      candidateCollection
    ) {

      peerConnection =
        new RTCPeerConnection(servers);


      /* Add local tracks */

      if (localStream) {

        localStream
          .getTracks()
          .forEach(track => {

            peerConnection.addTrack(
              track,
              localStream
            );

          });

      }


      /* ICE Candidate */

      peerConnection.onicecandidate =
        async (event) => {

          if (!event.candidate) {
            return;
          }


          await addDoc(

            collection(
              db,
              "calls",
              callId,
              candidateCollection
            ),

            event.candidate.toJSON()

          );

        };


      /* Remote Video */

      peerConnection.ontrack =
        (event) => {

          if (event.streams &&
              event.streams[0]) {

            remoteVideo.srcObject =
              event.streams[0];

            noVideo.style.display =
              "none";

          }

        };

    }


    /* Start Video Call */

    async function startVideoCall() {

      if (!currentUser ||
          !otherUserId) {

        alert(
          "Call user information missing."
        );

        return;

      }


      try {

        statusText.textContent =
          "Requesting camera and microphone permission...";


        localStream =
          await navigator.mediaDevices
            .getUserMedia({

              audio: true,

              video: true

            });


        localVideo.srcObject =
          localStream;


        const callId =
          getCallId(
            currentUser.uid,
            otherUserId
          );


        callDocId =
          callId;


        await createPeerConnection(
          callId,
          "callerCandidates"
        );


        const offer =
          await peerConnection
            .createOffer();


        await peerConnection
          .setLocalDescription(
            offer
          );


        await setDoc(

          doc(
            db,
            "calls",
            callId
          ),

          {

            callerId:
              currentUser.uid,

            receiverId:
              otherUserId,

            callerName:
              currentUser.displayName ||
              "WorldMitra User",

            receiverName:
              otherUserName,

            type:
              "video",

            status:
              "calling",

            offer: {

              type:
                offer.type,

              sdp:
                offer.sdp

            },

            createdAt:
              serverTimestamp()

          }

        );


        statusText.textContent =
          "Calling " +
          otherUserName +
          "...";


        startBtn.disabled =
          true;

        muteBtn.disabled =
          false;

        cameraBtn.disabled =
          false;

        endBtn.disabled =
          false;


        /* Listen for answer */

        callUnsubscribe =
          onSnapshot(

            doc(
              db,
              "calls",
              callId
            ),

            async (snapshot) => {

              if (!snapshot.exists()) {
                return;
              }


              const data =
                snapshot.data();


              if (
                data.answer &&
                !peerConnection.currentRemoteDescription
              ) {

                await peerConnection
                  .setRemoteDescription(

                    new RTCSessionDescription(
                      data.answer
                    )

                  );


                statusText.textContent =
                  "Video call connected 📹";

              }


              if (
                data.status === "ended"
              ) {

                finishCall(false);

              }

            }

          );


        /* Listen for receiver ICE */

        candidateUnsubscribe =
          onSnapshot(

            collection(
              db,
              "calls",
              callId,
              "receiverCandidates"
            ),

            snapshot => {

              snapshot.docChanges()
                .forEach(change => {

                  if (
                    change.type === "added"
                  ) {

                    peerConnection
                      .addIceCandidate(

                        new RTCIceCandidate(
                          change.doc.data()
                        )

                      )
                      .catch(
                        console.error
                      );

                  }

                });

            }

          );


      } catch (error) {

        console.error(error);


        statusText.textContent =
          "Video call could not start.";


        alert(
          "Video Call start नहीं हुई: " +
          error.message
        );

      }

    }


    /* Accept Incoming Video Call */

    async function acceptIncomingCall(
      callId,
      data
    ) {

      try {

        incomingBox.style.display =
          "none";


        statusText.textContent =
          "Requesting camera and microphone permission...";


        localStream =
          await navigator.mediaDevices
            .getUserMedia({

              audio: true,

              video: true

            });


        localVideo.srcObject =
          localStream;


        callDocId =
          callId;


        otherUserId =
          data.callerId;


        otherUserName =
          data.callerName ||
          "WorldMitra User";


        personName.textContent =
          "📹 " +
          otherUserName;


        await createPeerConnection(
          callId,
          "receiverCandidates"
        );


        await peerConnection
          .setRemoteDescription(

            new RTCSessionDescription(
              data.offer
            )

          );


        const answer =
          await peerConnection
            .createAnswer();


        await peerConnection
          .setLocalDescription(
            answer
          );


        await updateDoc(

          doc(
            db,
            "calls",
            callId
          ),

          {

            answer: {

              type:
                answer.type,

              sdp:
                answer.sdp

            },

            status:
              "accepted"

          }

        );


        statusText.textContent =
          "Video call connected 📹";


        startBtn.disabled =
          true;

        muteBtn.disabled =
          false;

        cameraBtn.disabled =
          false;

        endBtn.disabled =
          false;


        /* Listen for caller ICE */

        candidateUnsubscribe =
          onSnapshot(

            collection(
              db,
              "calls",
              callId,
              "callerCandidates"
            ),

            snapshot => {

              snapshot.docChanges()
                .forEach(change => {

                  if (
                    change.type === "added"
                  ) {

                    peerConnection
                      .addIceCandidate(

                        new RTCIceCandidate(
                          change.doc.data()
                        )

                      )
                      .catch(
                        console.error
                      );

                  }

                });

            }

          );


        /* Listen for call end */

        callUnsubscribe =
          onSnapshot(

            doc(
              db,
              "calls",
              callId
            ),

            snapshot => {

              if (!snapshot.exists()) {
                return;
              }


              if (
                snapshot.data().status ===
                "ended"
              ) {

                finishCall(false);

              }

            }

          );


      } catch (error) {

        console.error(error);


        alert(
          "Video Call accept नहीं हुई: " +
          error.message
        );


        statusText.textContent =
          "Could not connect the call.";

      }

    }


    /* Incoming Calls */

    function listenForIncomingCalls() {

      incomingUnsubscribe =
        onSnapshot(

          collection(
            db,
            "calls"
          ),

          snapshot => {

            snapshot.docChanges()
              .forEach(change => {

                if (
                  change.type !== "added" &&
                  change.type !== "modified"
                ) {

                  return;

                }


                const data =
                  change.doc.data();


                if (

                  data.receiverId ===
                  currentUser.uid &&

                  data.callerId !==
                  currentUser.uid &&

                  data.type ===
                  "video" &&

                  data.status ===
                  "calling"

                ) {

                  const callId =
                    change.doc.id;


                  incomingText.textContent =
                    (
                      data.callerName ||
                      "Someone"
                    ) +
                    " is calling you.";


                  incomingBox.style.display =
                    "block";


                  statusText.textContent =
                    "Incoming video call";


                  acceptBtn.onclick =
                    () => {

                      acceptIncomingCall(
                        callId,
                        data
                      );

                    };


                  rejectBtn.onclick =
                    async () => {

                      try {

                        await updateDoc(

                          doc(
                            db,
                            "calls",
                            callId
                          ),

                          {
                            status:
                              "ended"
                          }

                        );

                      } catch (error) {

                        console.error(
                          error
                        );

                      }


                      incomingBox.style.display =
                        "none";


                      statusText.textContent =
                        "Call rejected";

                    };

                }

              });

          }

        );

    }


    /* End Call */

    async function finishCall(
      updateServer = true
    ) {

      if (
        updateServer &&
        callDocId
      ) {

        try {

          await updateDoc(

            doc(
              db,
              "calls",
              callDocId
            ),

            {
              status:
                "ended"
            }

          );

        } catch (error) {

          console.error(
            error
          );

        }

      }


      if (callUnsubscribe) {

        callUnsubscribe();

        callUnsubscribe =
          null;

      }


      if (candidateUnsubscribe) {

        candidateUnsubscribe();

        candidateUnsubscribe =
          null;

      }


      if (localStream) {

        localStream
          .getTracks()
          .forEach(track => {

            track.stop();

          });

        localStream =
          null;

      }


      if (peerConnection) {

        peerConnection.close();

        peerConnection =
          null;

      }


      localVideo.srcObject =
        null;

      remoteVideo.srcObject =
        null;


      noVideo.style.display =
        "flex";


      statusText.textContent =
        "Call ended";


      startBtn.disabled =
        false;

      muteBtn.disabled =
        true;

      cameraBtn.disabled =
        true;

      endBtn.disabled =
        true;


      isMuted =
        false;

      isCameraOff =
        false;


      muteBtn.textContent =
        "🎤 Mute";


      cameraBtn.textContent =
        "📷 Camera Off";

    }


    /* Mute */

    function toggleMute() {

      if (!localStream) {
        return;
      }


      const tracks =
        localStream.getAudioTracks();


      tracks.forEach(track => {

        track.enabled =
          !track.enabled;

        isMuted =
          !track.enabled;

      });


      muteBtn.textContent =
        isMuted
          ? "🔇 Unmute"
          : "🎤 Mute";

    }


    /* Camera */

    function toggleCamera() {

      if (!localStream) {
        return;
      }


      const track
