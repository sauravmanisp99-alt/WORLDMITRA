<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      min-height: 100vh;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 25px;
    }

    .active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .google {
      background: white;
      color: #222;
      border: 1px solid #ddd;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 18px;
    }

    .gender-container {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .gender {
      flex: 1;
      padding: 18px;
      border: 2px solid #ddd;
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }

    .gender.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .error {
      color: red;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <!-- WELCOME -->
  <section id="welcomeScreen" class="screen active">

    <div class="box">

      <div class="logo">
        WorldMitra
      </div>

      <h1>
        Welcome to WorldMitra
      </h1>

      <p>
        Connect with people around the world.
      </p>

      <button id="getStartedButton">
        Get Started
      </button>

    </div>

  </section>


  <!-- GOOGLE LOGIN -->
  <section id="loginScreen" class="screen">

    <div class="box">

      <h1>
        Login to WorldMitra
      </h1>

      <p>
        Continue securely with your Google account.
      </p>

      <button id="googleButton" class="google">
        Continue with Google
      </button>

      <div id="loginError" class="error"></div>

    </div>

  </section>


  <!-- AGE -->
  <section id="ageScreen" class="screen">

    <div class="box">

      <h1>
        18+ Only
      </h1>

      <p>
        WorldMitra is available only for adults.
      </p>

      <input
        id="ageInput"
        type="number"
        min="18"
        max="100"
        placeholder="Enter your age"
      >

      <button id="ageButton">
        Continue
      </button>

      <div id="ageError" class="error"></div>

    </div>

  </section>


  <!-- GENDER -->
  <section id="genderScreen" class="screen">

    <div class="box">

      <h1>
        Select Gender
      </h1>

      <div class="gender-container">

        <div
          class="gender"
          data-gender="Male"
        >
          Male
        </div>

        <div
          class="gender"
          data-gender="Female"
        >
          Female
        </div>

      </div>

      <button id="genderButton">
        Continue
      </button>

      <div id="genderError" class="error"></div>

    </div>

  </section>


  <!-- HOME -->
  <section id="homeScreen" class="screen">

    <div class="box">

      <h1>
        WorldMitra
      </h1>

      <p>
        Welcome! Your profile setup is complete.
      </p>

      <button id="logoutButton">
        Logout
      </button>

    </div>

  </section>


  <!-- FIREBASE -->
  <script type="module">

    import { app } from "./firebase-config.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    const auth = getAuth(app);

    const googleProvider =
      new GoogleAuthProvider();


    function showScreen(id) {

      document
        .querySelectorAll(".screen")
        .forEach(screen => {

          screen.classList.remove("active");

        });

      document
        .getElementById(id)
        .classList.add("active");

    }


    // GET STARTED

    document
      .getElementById("getStartedButton")
      .addEventListener("click", function() {

        showScreen("loginScreen");

      });


    // GOOGLE LOGIN

    document
      .getElementById("googleButton")
      .addEventListener("click", async function() {

        const error =
          document.getElementById("loginError");

        error.textContent = "";

        try {

          await signInWithPopup(
            auth,
            googleProvider
          );

          showScreen("ageScreen");

        }

        catch (errorObject) {

          console.error(errorObject);

          error.textContent =
            errorObject.message;

        }

      });


    // AGE

    document
      .getElementById("ageButton")
      .addEventListener("click", function() {

        const age =
          Number(
            document.getElementById("ageInput").value
          );

        const error =
          document.getElementById("ageError");

        error.textContent = "";

        if (!age) {

          error.textContent =
            "Please enter your age.";

          return;

        }

        if (age < 18) {

          error.textContent =
            "WorldMitra is only for 18+ users.";

          return;

        }

        localStorage.setItem(
          "worldmitra_age",
          age
        );

        showScreen("genderScreen");

      });


    // GENDER

    let selectedGender = "";

    document
      .querySelectorAll(".gender")
      .forEach(gender => {

        gender.addEventListener(
          "click",
          function() {

            document
              .querySelectorAll(".gender")
              .forEach(item => {

                item.classList.remove(
                  "selected"
                );

              });

            this.classList.add(
              "selected"
            );

            selectedGender =
              this.dataset.gender;

          }
        );

      });


    // GENDER CONTINUE

    document
      .getElementById("genderButton")
      .addEventListener("click", function() {

        const error =
          document.getElementById("genderError");

        if (!selectedGender) {

          error.textContent =
            "Please select your gender.";

          return;

        }

        localStorage.setItem(
          "worldmitra_gender",
          selectedGender
        );

        showScreen("homeScreen");

      });


    // LOGOUT

    document
      .getElementById("logoutButton")
      .addEventListener("click", async function() {

        await signOut(auth);

        localStorage.clear();

        showScreen("welcomeScreen");

      });


    // AUTH STATE

    onAuthStateChanged(
      auth,
      function(user) {

        if (user) {

          console.log(
            "Logged in:",
            user.email
          );

        }

      }
    );

  </script>

</body>
</html>
