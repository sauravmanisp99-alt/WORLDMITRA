<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 25px 18px;
      justify-content: center;
    }

    .active {
      display: flex;
      flex-direction: column;
    }

    .box {
      width: 100%;
      max-width: 450px;
      margin: auto;
    }

    .logo {
      text-align: center;
      font-size: 40px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 15px;
    }

    h1, h2 {
      text-align: center;
    }

    p {
      color: #666;
      text-align: center;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .google {
      background: white;
      color: #222;
      border: 1px solid #ddd;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 18px;
    }

    .genders {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .gender {
      flex: 1;
      padding: 18px;
      text-align: center;
      background: white;
      border: 2px solid #ddd;
      border-radius: 12px;
      cursor: pointer;
    }

    .gender.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 12px;
    }

    .user {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-top: 15px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .user img {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
    }

    .online {
      color: green;
      font-size: 13px;
      margin-top: 4px;
    }

    .logout {
      background: #dc2626;
    }
  </style>
</head>

<body>

  <!-- WELCOME -->
  <div id="welcome" class="screen active">
    <div class="box">

      <div class="logo">WorldMitra</div>

      <h1>Meet People</h1>

      <p>
        Connect with people around the world.
      </p>

      <button id="getStarted">
        Get Started
      </button>

    </div>
  </div>


  <!-- LOGIN -->
  <div id="login" class="screen">
    <div class="box">

      <h2>Login to WorldMitra</h2>

      <p>Continue securely with your Google account.</p>

      <button id="googleLogin" class="google">
        Continue with Google
      </button>

      <div id="loginError" class="error"></div>

    </div>
  </div>


  <!-- AGE -->
  <div id="age" class="screen">
    <div class="box">

      <h2>18+ Only</h2>

      <p>
        WorldMitra is available only for adults.
      </p>

      <input
        id="ageInput"
        type="number"
        placeholder="Enter your age"
        min="18"
        max="100"
      >

      <button id="ageContinue">
        Continue
      </button>

      <div id="ageError" class="error"></div>

    </div>
  </div>


  <!-- GENDER -->
  <div id="gender" class="screen">
    <div class="box">

      <h2>Select Gender</h2>

      <p>Select your gender to continue.</p>

      <div class="genders">

        <div class="gender" data-gender="Male">
          Male
        </div>

        <div class="gender" data-gender="Female">
          Female
        </div>

      </div>

      <button id="genderContinue">
        Continue
      </button>

      <div id="genderError" class="error"></div>

    </div>
  </div>


  <!-- HOME -->
  <div id="home" class="screen">
    <div class="box">

      <h2>Live People</h2>

      <p>
        People currently online.
      </p>

      <div id="usersList"></div>

      <button id="logout" class="logout">
        Logout
      </button>

    </div>
  </div>


  <script type="module">

    import { app, db } from "./firebase-config.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      ref,
      set,
      onValue,
      onDisconnect,
      serverTimestamp,
      update
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();


    function show(id) {

      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      document.getElementById(id).classList.add("active");

    }


    // GET STARTED
    document.getElementById("getStarted").onclick = function() {

      if (auth.currentUser) {

        const savedAge =
          localStorage.getItem("worldmitra_age");

        const savedGender =
          localStorage.getItem("worldmitra_gender");

        if (!savedAge) {
          show("age");
        }
        else if (!savedGender) {
          show("gender");
        }
        else {
          show("home");
          loadUsers();
        }

      } else {

        show("login");

      }

    };


    // GOOGLE LOGIN
    document.getElementById("googleLogin").onclick = async function() {

      const error =
        document.getElementById("loginError");

      error.textContent = "";

      try {

        await signInWithPopup(auth, provider);

        show("age");

      }
      catch (e) {

        console.error(e);

        error.textContent =
          e.message || "Google login failed.";

      }

    };


    // AGE
    document.getElementById("ageContinue").onclick = function() {

      const age =
        Number(document.getElementById("ageInput").value);

      const error =
        document.getElementById("ageError");

      error.textContent = "";

      if (!age) {

        error.textContent = "Please enter your age.";
        return;

      }

      if (age < 18) {

        error.textContent =
          "WorldMitra is only for 18+ users.";

        return;

      }

      if (age > 100) {

        error.textContent =
          "Please enter a valid age.";

        return;

      }

      localStorage.setItem(
        "worldmitra_age",
        age
      );

      show("gender");

    };


    // GENDER
    let selectedGender = "";

    document.querySelectorAll(".gender").forEach(item => {

      item.onclick = function() {

        document.querySelectorAll(".gender")
          .forEach(g => g.classList.remove("selected"));

        item.classList.add("selected");

        selectedGender =
          item.dataset.gender;

      };

    });


    // GENDER CONTINUE
    document.getElementById("genderContinue").onclick = async function() {

      const error =
        document.getElementById("genderError");

      error.textContent = "";

      if (!selectedGender) {

        error.textContent =
          "Please select your gender.";

        return;

      }

      const user = auth.currentUser;

      if (!user) {

        show("login");
        return;

      }

      const age =
        Number(localStorage.getItem("worldmitra_age"));

      try {

        const userRef =
          ref(db, "users/" + user.uid);

        await set(userRef, {

          uid: user.uid,

          name:
            user.displayName || "WorldMitra User",

          email:
            user.email || "",

          photoURL:
            user.photoURL || "",

          age: age,

          gender: selectedGender,

          online: true,

          lastSeen:
            serverTimestamp()

        });

        onDisconnect(userRef).update({

          online: false,

          lastSeen:
            serverTimestamp()

        });

        localStorage.setItem(
          "worldmitra_gender",
          selectedGender
        );

        localStorage.setItem(
          "worldmitra_setup",
          "true"
        );

        show("home");

        loadUsers();

      }
      catch (e) {

        console.error(e);

        error.textContent =
          "Profile save failed.";

      }

    };


    // LOAD ONLINE USERS
    function loadUsers() {

      const usersRef =
        ref(db, "users");

      onValue(usersRef, snapshot => {

        const list =
          document.getElementById("usersList");

        list.innerHTML = "";

        let count = 0;

        snapshot.forEach(child => {

          const user = child.val();

          if (
            user.online === true &&
            child.key !== auth.currentUser?.uid
          ) {

            count++;

            const div =
              document.createElement("div");

            div.className = "user";

            div.innerHTML = `

              <img
                src="${user.photoURL || ""}"
                alt=""
              >

              <div>

                <strong>
                  ${user.name || "User"}
                </strong>

                <div>
                  Age: ${user.age || "N/A"}
                </div>

                <div class="online">
                  ● Online
                </div>

              </div>

            `;

            list.appendChild(div);

          }

        });


        if (count === 0) {

          list.innerHTML = `
            <p>
              No other people are online right now.
            </p>
          `;

        }

      });

    }


    // AUTH STATE
    onAuthStateChanged(auth, user => {

      if (!user) return;

      const savedAge =
        localStorage.getItem("worldmitra_age");

      const savedGender =
        localStorage.getItem("worldmitra_gender");

      if (savedAge && savedGender) {

        show("home");

        loadUsers();

      }

    });


    // LOGOUT
    document.getElementById("logout").onclick = async function() {

      await signOut(auth);

      localStorage.removeItem("worldmitra_age");
      localStorage.removeItem("worldmitra_gender");
      localStorage.removeItem("worldmitra_setup");

      show("welcome");

    };

  </script>

</body>
</html>
