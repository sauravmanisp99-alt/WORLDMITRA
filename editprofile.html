<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8ff;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .profile-card {
      width: 92%;
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 30px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .back {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 10px;
      background: #111827;
      color: white;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="header">
    🌍 WorldMitra
  </div>

  <div class="profile-card">

    <h1>✏️ Edit Profile</h1>

    <p class="subtitle">
      Update your information so people can know you better.
    </p>

    <label for="name">
      👤 Name
    </label>

    <input
      type="text"
      id="name"
      placeholder="Enter your name"
      maxlength="50"
    >


    <label for="country">
      🌍 Country
    </label>

    <input
      type="text"
      id="country"
      placeholder="Enter your country"
      maxlength="50"
    >


    <label for="bio">
      📝 About You
    </label>

    <textarea
      id="bio"
      placeholder="Tell people a little about yourself..."
      maxlength="300"
    ></textarea>


    <label for="interests">
      ❤️ Interests
    </label>

    <input
      type="text"
      id="interests"
      placeholder="Example: Music, Cricket, Travel"
      maxlength="200"
    >


    <button
      id="saveBtn"
      class="btn"
    >
      💾 Save Profile
    </button>

    <div id="message"></div>

    <a
      href="profile.html"
      class="back"
    >
      ← Back to Profile
    </a>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    const nameInput =
      document.getElementById("name");

    const countryInput =
      document.getElementById("country");

    const bioInput =
      document.getElementById("bio");

    const interestsInput =
      document.getElementById("interests");

    const saveBtn =
      document.getElementById("saveBtn");

    const message =
      document.getElementById("message");


    let currentUser = null;


    /* LOAD EXISTING PROFILE */

    async function loadProfile(user) {

      try {

        const profileRef =
          doc(
            db,
            "users",
            user.uid
          );

        const profileSnapshot =
          await getDoc(profileRef);


        if (profileSnapshot.exists()) {

          const data =
            profileSnapshot.data();


          nameInput.value =
            data.name || "";

          countryInput.value =
            data.country || "";

          bioInput.value =
            data.bio || "";

          interestsInput.value =
            data.interests || "";

        } else {

          /* Use Firebase account name if available */

          nameInput.value =
            user.displayName || "";

        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Profile load नहीं हो सकी.";

        message.style.color =
          "#dc2626";

      }

    }


    /* SAVE PROFILE */

    saveBtn.addEventListener(
      "click",
      async () => {

        if (!currentUser) {

          return;

        }


        const name =
          nameInput.value.trim();

        const country =
          countryInput.value.trim();

        const bio =
          bioInput.value.trim();

        const interests =
          interestsInput.value.trim();


        if (!name) {

          message.textContent =
            "Please enter your name.";

          message.style.color =
            "#dc2626";

          return;

        }


        saveBtn.disabled = true;

        saveBtn.textContent =
          "Saving...";

        message.textContent = "";


        try {

          await setDoc(
            doc(
              db,
              "users",
              currentUser.uid
            ),
            {
              uid: currentUser.uid,

              name: name,

              country: country,

              bio: bio,

              interests: interests,

              email:
                currentUser.email || "",

              updatedAt:
                serverTimestamp()
            },
            {
              merge: true
            }
          );


          message.textContent =
            "✅ Profile saved successfully!";

          message.style.color =
            "#16a34a";


          setTimeout(() => {

            window.location.href =
              "profile.html";

          }, 1000);


        } catch (error) {

          console.error(error);

          message.textContent =
            "Profile save नहीं हो सकी: " +
            error.message;

          message.style.color =
            "#dc2626";

        }


        saveBtn.disabled = false;

        saveBtn.textContent =
          "💾 Save Profile";

      }
    );


    /* AUTH CHECK */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser = user;

        await loadProfile(user);

      }
    );

  </script>

</body>
</html>
