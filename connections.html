<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Connections - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8ff;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 25px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 20px;
    }

    .connection-card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    .info {
      flex: 1;
    }

    .info h2 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .country {
      color: #667085;
      font-size: 14px;
    }

    .message-btn {
      border: none;
      background: #16a34a;
      color: white;
      padding: 10px 14px;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      background: white;
      padding: 35px 20px;
      border-radius: 16px;
      text-align: center;
      color: #667085;
    }

    .back {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 20px;
      padding: 13px;
      background: #111827;
      color: white;
      border-radius: 10px;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .connection-card {
        flex-wrap: wrap;
      }

      .message-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    🌍 WorldMitra
  </div>

  <div class="container">

    <h1>🤝 My Connections</h1>

    <p class="subtitle">
      People you are connected with.
    </p>

    <div id="connectionsList">
      <div class="empty">
        Loading connections...
      </div>
    </div>

    <a href="profile.html" class="back">
      ← Back to Profile
    </a>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const connectionsList =
      document.getElementById("connectionsList");


    async function loadConnections(user) {

      try {

        const sentQuery = query(
          collection(db, "connectionRequests"),
          where("fromUserId", "==", user.uid),
          where("status", "==", "accepted")
        );


        const receivedQuery = query(
          collection(db, "connectionRequests"),
          where("toUserId", "==", user.uid),
          where("status", "==", "accepted")
        );


        const sentSnapshot =
          await getDocs(sentQuery);

        const receivedSnapshot =
          await getDocs(receivedQuery);


        const connections = [];


        sentSnapshot.forEach((doc) => {

          const data = doc.data();

          connections.push({
            uid: data.toUserId,
            name: data.toName || "WorldMitra User",
            country: data.toCountry || ""
          });

        });


        receivedSnapshot.forEach((doc) => {

          const data = doc.data();

          connections.push({
            uid: data.fromUserId,
            name: data.fromName || "WorldMitra User",
            country: data.fromCountry || ""
          });

        });


        connectionsList.innerHTML = "";


        if (connections.length === 0) {

          connectionsList.innerHTML = `
            <div class="empty">
              You don't have any connections yet. 🌍
              <br><br>
              Go to Find People and connect with someone!
            </div>
          `;

          return;
        }


        const uniqueConnections = [];

        const seen = new Set();


        connections.forEach((person) => {

          if (!seen.has(person.uid)) {

            seen.add(person.uid);

            uniqueConnections.push(person);

          }

        });


        uniqueConnections.forEach((person) => {

          const card =
            document.createElement("div");

          card.className = "connection-card";


          const firstLetter =
            (person.name || "U")
              .charAt(0)
              .toUpperCase();


          card.innerHTML = `
            <div class="avatar">
              ${firstLetter}
            </div>

            <div class="info">

              <h2>
                ${person.name}
              </h2>

              <div class="country">
                🌎 ${person.country || "Country not available"}
              </div>

            </div>

            <button class="message-btn">
              💬 Message
            </button>
          `;


          const messageButton =
            card.querySelector(".message-btn");


          messageButton.addEventListener(
  "click",
  () => {

    const chatUrl =
      "chat.html?uid=" +
      encodeURIComponent(person.uid) +
      "&name=" +
      encodeURIComponent(person.name);

    window.location.href = chatUrl;

  }
);
          
          

          
              
              

            
  


          connectionsList.appendChild(card);

        });


      } catch (error) {

        console.error(error);

        connectionsList.innerHTML = `
          <div class="empty">
            Connections load नहीं हो पाए।
            <br><br>
            ${error.message}
          </div>
        `;

      }

    }


    onAuthStateChanged(auth, (user) => {

      if (!user) {

        window.location.href = "login.html";

        return;

      }

      loadConnections(user);

    });

  </script>

</body>
</html>
