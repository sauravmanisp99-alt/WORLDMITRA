<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Call - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .call-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px 22px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto 18px;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .status {
      color: #667085;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* CALL TIMER */
    .timer {
      font-size: 30px;
      font-weight: bold;
      color: #2563eb;
      margin: 8px 0 22px;
      display: none;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn,
    #acceptBtn {
      background: #16a34a;
      color: white;
    }

    #rejectBtn,
    #endBtn {
      background: #dc2626;
      color: white;
    }

    #muteBtn {
      background: #f59e0b;
      color: white;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-decoration: none;
      background: #111827;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-weight: bold;
    }

    .incoming {
      display: none;
      margin-bottom: 20px;
      padding: 18px;
      border-radius: 15px;
      background: #eef4ff;
    }

    .incoming h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .incoming p {
      color: #667085;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <div class="call-box">

    <div class="avatar" id="avatar">W</div>

    <h1 id="personName">Voice Call</h1>

    <p class="status" id="status">
      Ready to call
    </p>

    <!-- CALL TIMER -->
    <div class="timer" id="timer">
      00:00
    </div>

    <div class="incoming" id="incomingBox">

      <h2>📞 Incoming Voice Call</h2>

      <p id="incomingText">
        Someone is calling you.
      </p>

      <div class="buttons">

        <button id="acceptBtn">
          ✅ Accept
        </button>

        <button id="rejectBtn">
          ❌ Reject
        </button>

      </div>

    </div>

    <div class="buttons">

      <button id="startBtn">
        📞 Start Call
      </button>

      <button id="muteBtn" disabled>
        🎤 Mute
      </button>

      <button id="endBtn" disabled>
        🔴 End Call
      </button>

    </div>

    <a href="connections.html" class="back">
      ← Back to Connections
    </a>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      addDoc,
      onSnapshot,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    const avatar =
      document.getElementById("avatar");

    const personName =
      document.getElementById("personName");

    const statusText =
      document.getElementById("status");

    const timer =
      document.getElementById("timer");

    const startBtn =
      document.getElementById("startBtn");

    const muteBtn =
      document.getElementById("muteBtn");

    const endBtn =
      document.getElementById("endBtn");

    const incomingBox =
      document.getElementById("incomingBox");

    const incomingText =
      document.getElementById("incomingText");

    const acceptBtn =
      document.getElementById("acceptBtn");

    const rejectBtn =
      document.getElementById("rejectBtn");


    let currentUser = null;

    let otherUserId = null;

    let otherUserName = "WorldMitra User";

    let localStream = null;

    let peerConnection = null;

    let callDocId = null;

    let callUnsubscribe = null;

    let candidateUnsubscribe = null;

    let incomingUnsubscribe = null;

    let isMuted = false;


    /* TIMER VARIABLES */

    let callStartTime = null;

    let timerInterval = null;


    const servers = {
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        }
      ]
    };


    /* START TIMER */

    function startTimer() {

      stopTimer();

      callStartTime = Date.now();

      timer.style.display = "block";

      timer.textContent = "00:00";

      timerInterval =
        setInterval(() => {

          const elapsed =
            Math.floor(
              (Date.now() - callStartTime) / 1000
            );

          const minutes =
            Math.floor(elapsed / 60);

          const seconds =
            elapsed % 60;

          timer.textContent =
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");

        }, 1000);

    }


    /* STOP TIMER */

    function stopTimer() {

      if (timerInterval) {

        clearInterval(timerInterval);

        timerInterval = null;

      }

      callStartTime = null;

    }


    async function createPeerConnection(
      callId,
      candidateCollection
    ) {

      peerConnection =
        new RTCPeerConnection(servers);


      if (localStream) {

        localStream
          .getTracks()
          .forEach(track => {

            peerConnection.addTrack(
              track,
              localStream
            );

          });

      }


      peerConnection.onicecandidate =
        async (event) => {

          if (!event.candidate) {
            return;
          }

          await addDoc(
            collection(
              db,
              "calls",
              callId,
              candidateCollection
            ),
            event.candidate.toJSON()
          );

        };


      peerConnection.ontrack =
        (event) => {

          let audio =
            document.getElementById("remoteAudio");

          if (!audio) {

            audio =
              document.createElement("audio");

            audio.id = "remoteAudio";

            audio.autoplay = true;

            document.body.appendChild(audio);

          }

          audio.srcObject =
            event.streams[0];

        };

    }


    async function startVoiceCall() {

      if (!currentUser || !otherUserId) {

        alert("Call user information missing.");

        return;

      }


      try {

        statusText.textContent =
          "Requesting microphone permission...";


        localStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false
          });


        const callId =
          getCallId(
            currentUser.uid,
            otherUserId
          );


        callDocId = callId;


        await createPeerConnection(
          callId,
          "callerCandidates"
        );


        const offer =
          await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
          offer
        );


        await setDoc(
          doc(db, "calls", callId),
          {
            callerId: currentUser.uid,

            receiverId: otherUserId,

            callerName:
              currentUser.displayName ||
              "WorldMitra User",

            receiverName:
              otherUserName,

            type: "voice",

            status: "calling",

            offer: {
              type: offer.type,
              sdp: offer.sdp
            },

            createdAt:
              serverTimestamp()
          }
        );


        statusText.textContent =
          "Calling " + otherUserName + "...";


        startBtn.disabled = true;

        muteBtn.disabled = false;

        endBtn.disabled = false;


        callUnsubscribe =
          onSnapshot(
            doc(db, "calls", callId),
            async (snapshot) => {

              if (!snapshot.exists()) {
                return;
              }

              const data =
                snapshot.data();


              if (
                data.answer &&
                !peerConnection.currentRemoteDescription
              ) {

                await peerConnection.setRemoteDescription(
                  new RTCSessionDescription(
                    data.answer
                  )
                );

                statusText.textContent =
                  "Voice call connected 📞";

                /* START TIMER WHEN CONNECTED */

                startTimer();

              }


              if (data.status === "ended") {

                finishCall(false);

              }

            }
          );


        candidateUnsubscribe =
          onSnapshot(
            collection(
              db,
              "calls",
              callId,
              "receiverCandidates"
            ),
            snapshot => {

              snapshot.docChanges()
                .forEach(change => {

                  if (change.type === "added") {

                    peerConnection
                      .addIceCandidate(
                        new RTCIceCandidate(
                          change.doc.data()
                        )
                      )
                      .catch(console.error);

                  }

                });

            }
          );


      } catch (error) {

        console.error(error);

        statusText.textContent =
          "Voice call could not start.";

        alert(
          "Voice call start नहीं हुई: " +
          error.message
        );

      }

    }


    async function acceptIncomingCall(
      callId,
      data
    ) {

      try {

        incomingBox.style.display =
          "none";

        statusText.textContent =
          "Requesting microphone permission...";


        localStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false
          });


        callDocId = callId;

        otherUserId =
          data.callerId;

        otherUserName =
          data.callerName ||
          "WorldMitra User";


        personName.textContent =
          "📞 " + otherUserName;


        avatar.textContent =
          otherUserName
            .charAt(0)
            .toUpperCase();


        await createPeerConnection(
          callId,
          "receiverCandidates"
        );


        await peerConnection.setRemoteDescription(
          new RTCSessionDescription(
            data.offer
          )
        );


        const answer =
          await peerConnection.createAnswer();


        await peerConnection.setLocalDescription(
          answer
        );


        await updateDoc(
          doc(db, "calls", callId),
          {
            answer: {
              type: answer.type,
              sdp: answer.sdp
            },

            status: "accepted"
          }
        );


        statusText.textContent =
          "Voice call connected 📞";


        /* START TIMER FOR RECEIVER */

        startTimer();


        startBtn.disabled = true;

        muteBtn.disabled = false;

        endBtn.disabled = false;


        candidateUnsubscribe =
          onSnapshot(
            collection(
              db,
              "calls",
              callId,
              "callerCandidates"
            ),
            snapshot => {

              snapshot.docChanges()
                .forEach(change => {

                  if (change.type === "added") {

                    peerConnection
                      .addIceCandidate(
                        new RTCIceCandidate(
                          change.doc.data()
                        )
                      )
                      .catch(console.error);

                  }

                });

            }
          );


        callUnsubscribe =
          onSnapshot(
            doc(db, "calls", callId),
            snapshot => {

              if (!snapshot.exists()) {
                return;
              }

              if (
                snapshot.data().status === "ended"
              ) {

                finishCall(false);

              }

            }
          );


      } catch (error) {

        console.error(error);

        alert(
          "Call accept नहीं हुई: " +
          error.message
        );

        statusText.textContent =
          "Could not connect the call.";

      }

    }


    function listenForIncomingCalls() {

      incomingUnsubscribe =
        onSnapshot(
          collection(db, "calls"),
          snapshot => {

            snapshot.docChanges()
              .forEach(change => {

                if (
                  change.type !== "added" &&
                  change.type !== "modified"
                ) {

                  return;

                }


                const data =
                  change.doc.data();


                if (
                  data.receiverId === currentUser.uid &&
                  data.callerId !== currentUser.uid &&
                  data.type === "voice" &&
                  data.status === "calling"
                ) {

                  const callId =
                    change.doc.id;


                  incomingText.textContent =
                    (data.callerName ||
                    "Someone") +
                    " is calling you.";


                  incomingBox.style.display =
                    "block";


                  statusText.textContent =
                    "Incoming voice call";


                  acceptBtn.onclick =
                    () => {

                      acceptIncomingCall(
                        callId,
                        data
                      );

                    };


                  rejectBtn.onclick =
                    async () => {

                      try {

                        await updateDoc(
                          doc(
                            db,
                            "calls",
                            callId
                          ),
                          {
                            status: "ended"
                          }
                        );

                      } catch (error) {

                        console.error(error);

                      }


                      incomingBox.style.display =
                        "none";

                      statusText.textContent =
                        "Call rejected";

                    };

                }

              });

          }
        );

    }


    async function finishCall(
      updateServer = true
    ) {

      if (
        updateServer &&
        callDocId
      ) {

        try {

          await updateDoc(
            doc(
              db,
              "calls",
              callDocId
            ),
            {
              status: "ended"
            }
          );

        } catch (error) {

          console.error(error);

        }

      }


      /* STOP TIMER */

      stopTimer();


      if (callUnsubscribe) {

        callUnsubscribe();

        callUnsubscribe = null;

      }


      if (candidateUnsubscribe) {

        candidateUnsubscribe();

        candidateUnsubscribe = null;

      }


      if (localStream) {

        localStream
          .getTracks()
          .forEach(track =>
            track.stop()
          );

        localStream = null;

      }


      if (peerConnection) {

        peerConnection.close();

        peerConnection = null;

      }


      const audio =
        document.getElementById("remoteAudio");


      if (audio) {

        audio.srcObject = null;

        audio.remove();

      }


      statusText.textContent =
        "Call ended";


      startBtn.disabled = false;

      muteBtn.disabled = true;

      endBtn.disabled = true;


      isMuted = false;


      muteBtn.textContent =
        "🎤 Mute";

    }


    function toggleMute() {

      if (!localStream) {
        return;
      }


      const tracks =
        localStream.getAudioTracks();


      tracks.forEach(track => {

        track.enabled =
          !track.enabled;

        isMuted =
          !track.enabled;

      });


      muteBtn.textContent =
        isMuted
          ? "🔇 Unmute"
          : "🎤 Mute";

    }


    function getCallId(
      userA,
      userB
    ) {

      return [
        userA,
        userB
      ]
      .sort()
      .join("_");

    }


    startBtn.addEventListener(
      "click",
      startVoiceCall
    );


    muteBtn.addEventListener(
      "click",
      toggleMute
    );


    endBtn.addEventListener(
      "click",
      () => finishCall(true)
    );


    onAuthStateChanged(
      auth,
      (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser = user;


        const params =
          new URLSearchParams(
            window.location.search
          );


        otherUserId =
          params.get("uid");


        otherUserName =
          params.get("name") ||
          "WorldMitra User";


        personName.textContent =
          "📞 " + otherUserName;


        avatar.textContent =
          otherUserName
            .charAt(0)
            .toUpperCase();


        if (!otherUserId) {

          startBtn.disabled = true;

          statusText.textContent =
            "Waiting for incoming calls...";

        }


        listenForIncomingCalls();

      }
    );

  </script>

</body>
</html>
