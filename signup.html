<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>WorldMitra - Mobile OTP</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 25px;
    }

    .title {
      text-align: center;
      font-size: 27px;
      color: #111827;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #344054;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #otpSection {
      display: none;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .safety {
      margin-top: 22px;
      padding: 12px;
      background: #f5f8ff;
      border-radius: 10px;
      font-size: 13px;
      color: #667085;
      line-height: 1.5;
      text-align: center;
    }

    #recaptcha-container {
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 22px;
      }

      .logo {
        font-size: 25px;
      }

      .title {
        font-size: 24px;
      }
    }
  </style></head><body>  <div class="container"><div class="logo">
  🌍 WorldMitra
</div>

<h1 class="title">
  Connect with the World
</h1>

<p class="subtitle">
  Enter your mobile number to continue.
  We will send you a verification OTP.
</p>


<!-- MOBILE NUMBER -->
<div id="phoneSection">

  <label for="phone">
    Mobile Number
  </label>

  <input
    type="tel"
    id="phone"
    placeholder="+91 9876543210"
    autocomplete="tel"
  >

  <div id="recaptcha-container"></div>

  <button id="sendOtpBtn">
    Send OTP
  </button>

</div>


<!-- OTP -->
<div id="otpSection">

  <label for="otp">
    Enter OTP
  </label>

  <input
    type="text"
    id="otp"
    placeholder="Enter 6-digit OTP"
    maxlength="6"
    inputmode="numeric"
    autocomplete="one-time-code"
  >

  <button id="verifyOtpBtn">
    Verify OTP
  </button>

  <button
    id="changeNumberBtn"
    style="margin-top:10px; background:#e5e7eb; color:#111827;"
  >
    Change Number
  </button>

</div>


<div id="message" class="message"></div>


<div class="safety">
  🛡️ Your phone number is used for secure verification.
  Please use WorldMitra respectfully and safely.
</div>

  </div>  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      RecaptchaVerifier,
      signInWithPhoneNumber
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",

      authDomain: "worldmitra-33ca6.firebaseapp.com",

      projectId: "worldmitra-33ca6",

      storageBucket: "worldmitra-33ca6.firebasestorage.app",

      messagingSenderId: "1089520845776",

      appId: "1:1089520845776:web:2789654cc6061e7034afd5"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const phoneInput =
      document.getElementById("phone");

    const otpInput =
      document.getElementById("otp");

    const sendOtpBtn =
      document.getElementById("sendOtpBtn");

    const verifyOtpBtn =
      document.getElementById("verifyOtpBtn");

    const changeNumberBtn =
      document.getElementById("changeNumberBtn");

    const phoneSection =
      document.getElementById("phoneSection");

    const otpSection =
      document.getElementById("otpSection");

    const message =
      document.getElementById("message");


    let confirmationResult = null;


    function showMessage(text, success = false) {

      message.textContent = text;

      message.style.color =
        success ? "#15803d" : "#dc2626";

    }


    // Firebase reCAPTCHA
    const recaptchaVerifier =
      new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
          size: "normal"
        }
      );


    // SEND OTP
    sendOtpBtn.addEventListener("click", async () => {

      const phoneNumber =
        phoneInput.value.trim();


      if (!phoneNumber) {

        showMessage(
          "Please enter your mobile number."
        );

        return;
      }


      if (!phoneNumber.startsWith("+")) {

        showMessage(
          "Please enter the country code also. Example: +91 9876543210"
        );

        return;
      }


      sendOtpBtn.disabled = true;

      showMessage("Sending OTP...", true);


      try {

        confirmationResult =
          await signInWithPhoneNumber(
            auth,
            phoneNumber,
            recaptchaVerifier
          );


        phoneSection.style.display = "none";

        otpSection.style.display = "block";

        showMessage(
          "OTP sent successfully. Please check your phone.",
          true
        );


      } catch (error) {

        console.error(error);

        sendOtpBtn.disabled = false;

        showMessage(
          "OTP send नहीं हुआ: " + error.message
        );

      }

    });


    // VERIFY OTP
    verifyOtpBtn.addEventListener("click", async () => {

      const otp =
        otpInput.value.trim();


      if (!otp || otp.length !== 6) {

        showMessage(
          "Please enter the 6-digit OTP."
        );

        return;
      }


      if (!confirmationResult) {

        showMessage(
          "Please request OTP again."
        );

        return;
      }


      verifyOtpBtn.disabled = true;

      showMessage("Verifying OTP...", true);


      try {

        const result =
          await confirmationResult.confirm(otp);


        const user = result.user;


        console.log(
          "WorldMitra user logged in:",
          user.uid
        );


        showMessage(
          "Verification successful! Opening WorldMitra...",
          true
        );


        setTimeout(() => {

          window.location.href =
            "profile.html";

        }, 700);


      } catch (error) {

        console.error(error);

        verifyOtpBtn.disabled = false;

        showMessage(
          "Invalid OTP. Please try again."
        );

      }

    });


    // CHANGE NUMBER
    changeNumberBtn.addEventListener("click", () => {

      otpSection.style.display = "none";

      phoneSection.style.display = "block";

      otpInput.value = "";

      sendOtpBtn.disabled = false;

      showMessage("");

    });

  </script></body>
</html>
