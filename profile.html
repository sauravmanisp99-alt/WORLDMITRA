      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
      min-height: 100vh;
    }

    /* ================= HEADER ================= */

    .top-header {
      width: 100%;
      height: 64px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .header-profile {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      overflow: hidden;
    }

    .header-profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* ================= PAGE ================= */

    .page {
      width: 100%;
      max-width: 1050px;
      margin: auto;
      padding: 25px 16px 40px;
    }

    /* ================= PROFILE HERO ================= */

    .profile-hero {
      background: white;
      border-radius: 22px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 5px 22px rgba(0,0,0,0.07);
      margin-bottom: 18px;
    }

    .avatar-wrapper {
      position: relative;
      width: 115px;
      height: 115px;
      margin: 0 auto 15px;
    }

    .avatar {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 42px;
      font-weight: bold;
      border: 4px solid #e7efff;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .profile-name {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .profile-email {
      color: #667085;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .profile-country {
      color: #475467;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .bio {
      max-width: 650px;
      margin: auto;
      color: #475467;
      line-height: 1.6;
      font-size: 15px;
    }

    /* ================= PHOTO ================= */

    .photo-area {
      margin-top: 20px;
    }

    .photo-btn {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .photo-btn:hover {
      background: #1d4ed8;
    }

    #photoInput {
      display: none;
    }

    .photo-status {
      min-height: 18px;
      margin-top: 9px;
      color: #667085;
      font-size: 13px;
    }

    /* ================= INTERESTS ================= */

    .interests {
      margin-top: 18px;
      background: #eef4ff;
      padding: 13px;
      border-radius: 12px;
      color: #344054;
      line-height: 1.5;
      font-size: 14px;
    }

    /* ================= MENU ================= */

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 22px 4px 12px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .menu-item {
      background: white;
      min-height: 92px;
      border-radius: 16px;
      text-decoration: none;
      color: #172033;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .menu-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(0,0,0,0.09);
    }

    .menu-icon {
      font-size: 25px;
    }

    .notification-badge {
      position: absolute;
      top: 8px;
      right: 12px;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 20px;
      background: #ef4444;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .notification-badge.hidden {
      display: none;
    }

    /* ================= BOTTOM ACTIONS ================= */

    .edit-btn {
      display: block;
      width: 100%;
      max-width: 600px;
      margin: 22px auto 10px;
      padding: 14px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      text-align: center;

      padding: 14px;

      border-radius: 12px;

      font-size: 16px;

      .page {

      }

      }

    /* ================= IMAGE COMPRESSION ================= */

    function compressImage(file) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();


          reader.onload =
            function(event) {

              const image =
                new Image();


              image.onload =
                function() {

                  const maxSize =
                    500;


                  let width =
                    image.width;

                  let height =
                    image.height;


                  if (
                    width > height
                  ) {

                    if (
                      width > maxSize
                    ) {

                      height =
                        Math.round(
                          height *
                          maxSize /
                          width
                        );

                      width =
                        maxSize;

                    }

                  } else {

                    if (
                      height > maxSize
                    ) {

                      width =
                        Math.round(
                          width *
                          maxSize /
                          height
                        );

                      height =
                        maxSize;

                    }

                  }


                  const canvas =
                    document.createElement(
                      "canvas"
                    );


                  canvas.width =
                    width;

                  canvas.height =
                    height;


                  const context =
                    canvas.getContext(
                      "2d"
                    );


                  context.drawImage(
                    image,
                    0,
                    0,
                    width,
                    height
                  );


                  const compressed =
                    canvas.toDataURL(
                      "image/jpeg",
                      0.75
                    );


                  resolve(
                    compressed
                  );

                };


              image.onerror =
                function() {

                  reject(
                    new Error(
                      "Image could not be loaded."
                    )
                  );

                };


              image.src =
                event.target.result;

            };


          reader.onerror =
            function() {

              reject(
                new Error(
                  "Image could not be read."
                )
              );

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }

        }


        try {

          photoStatus.textContent =
            "Preparing photo...";


          const compressedImage =
            await compressImage(
              file
            );


          /* SHOW PHOTO */

          profileImage.src =
            compressedImage;

          profileImage.style.display =
            "block";

          avatarLetter.style.display =
            "none";


          headerImage.src =
            compressedImage;

          headerImage.style.display =
            "block";

          headerLetter.style.display =
            "none";


          photoStatus.textContent =
            "Saving photo...";


          if (!currentUser) {

            photoStatus.textContent =
              "Please login first.";

            return;

          }


          const profileRef =
            doc(
              db,
              "users",
              currentUser.uid
            );


          const profileSnapshot =
            await getDoc(
              profileRef
            );


          if (
            profileSnapshot.exists()
          ) {

            await updateDoc(
              profileRef,
              {
                profileImage:
                  compressedImage
              }
            );

          } else {

            await setDoc(
              profileRef,
              {
                profileImage:
                  compressedImage,

                email:
                  currentUser.email ||
                  ""
              },
              {
                merge: true
              }
            );

          }


          photoStatus.textContent =
            "✅ Profile photo saved.";

        } catch (error) {

          console.error(
            "Photo save error:",
            error
          );


          photoStatus.textContent =
            "❌ Photo save नहीं हो पाया.";

        }

      }
    );


    /* ================= AUTH ================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser =
          user;


        await loadProfile(
          user
        );


        await loadNotificationCount();

      }
    );


    /* ================= LOGOUT ================= */

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          logoutBtn.disabled =
            true;

          logoutBtn.textContent =
            "Logging out...";


          await signOut(
            auth
          );


          window.location.href =
            "login.html";

        } catch (error) {

          console.error(
            error
          );


          logoutBtn.disabled =
            false;

          logoutBtn.textContent =
            "🚪 Logout";


          alert(
            "Logout नहीं हो पाया: " +
            error.message
          );

        }

      }hai 
    );

  </script>

</body>
</html>
