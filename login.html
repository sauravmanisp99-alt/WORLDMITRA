<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup {
      text-align: center;
      margin-top: 22px;
      color: #667085;
    }

    .signup a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .safety {
      margin-top: 20px;
      padding: 12px;
      background: #f5f8ff;
      border-radius: 10px;
      text-align: center;
      color: #667085;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🌍 WorldMitra</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to continue your conversations.
    </p>

    <form>

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

    <p class="signup">
      Don't have an account?
      <a href="signup.html">Create Account</a>
    </p>

    <div class="safety">
      🛡️ Keep your password private. Never share it with anyone.
    </div>

  </div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
    authDomain: "worldmitra-33ca6.firebaseapp.com",
    projectId: "worldmitra-33ca6",
    storageBucket: "worldmitra-33ca6.firebasestorage.app",
    messagingSenderId: "1089520845776",
    appId: "1:1089520845776:web:2789654cc6061e7034afd5"
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.querySelector("form").addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);

      alert("Login successful! 🎉");
      window.location.href = "index.html";

    } catch (error) {
      alert("Login failed: " + error.message);
    }
  });
</script>
</body>
</html>
