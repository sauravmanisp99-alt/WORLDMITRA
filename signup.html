<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .title {
      text-align: center;
      font-size: 28px;
      margin-top: 15px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #d0d5dd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #2563eb;
    }

    .create-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .create-btn:hover {
      background: #1d4ed8;
    }

    .login-text {
      text-align: center;
      margin-top: 22px;
      color: #667085;
    }

    .login-text a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .safety {
      margin-top: 20px;
      padding: 12px;
      background: #f5f8ff;
      border-radius: 10px;
      font-size: 13px;
      color: #667085;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🌍 WorldMitra</div>

    <h1 class="title">Create Account</h1>

    <p class="subtitle">
      Join WorldMitra and connect with people around the world.
    </p>

    <form>

      <label for="name">Your Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="country">Country</label>
      <select id="country" required>
        <option value="">Select your country</option>
        <option>India</option>
        <option>United Arab Emirates</option>
        <option>United Kingdom</option>
        <option>United States</option>
        <option>Canada</option>
        <option>Australia</option>
        <option>Germany</option>
        <option>France</option>
        <option>Austria</option>
        <option>Japan</option>
        <option>Other</option>
      </select>

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
      >

      <button type="submit" class="create-btn">
        Create Account
      </button>

    </form>

    <p class="login-text">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <div class="safety">
      🛡️ Please keep personal information private and use
      WorldMitra respectfully and safely.
    </div>

  </div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
    authDomain: "worldmitra-33ca6.firebaseapp.com",
    projectId: "worldmitra-33ca6",
    storageBucket: "worldmitra-33ca6.firebasestorage.app",
    messagingSenderId: "1089520845776",
    appId: "1:1089520845776:web:2789654cc6061e7034afd5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.querySelector("form").addEventListener("submit", async (event) => {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await createUserWithEmailAndPassword(auth, email, password);
      alert("Account created successfully!");
      window.location.href = "login.html";
    } catch (error) {
      alert("Account create नहीं हुआ: " + error.message);
    }
  });
</script>
</body>
</html>
