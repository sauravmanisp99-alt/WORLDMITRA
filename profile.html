<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorldMitra - Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    .header {
      background: #1877f2;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .profile-card {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      border-radius: 18px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .avatar {
      width: 100px;
      height: 100px;
      margin: auto;
      border-radius: 50%;
      background: #1877f2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
    }

    h2 {
      margin-top: 15px;
    }

    .email {
      color: #777;
      margin-top: 8px;
    }

    .bio {
      margin: 20px 0;
      color: #555;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      background: #0d65d9;
    }

    .logout {
      background: #e53935;
    }
  </style>
</head>

<body>

  <div class="header">
    🌍 WorldMitra
  </div>

  <div class="profile-card">

    <div class="avatar">W</div>

    <h2>My Profile</h2>

    <p class="email">Welcome to WorldMitra</p>

    <p class="bio">
      Connect with people around the world, make new friends
      and discover new cultures.
    </p>

    <a href="index.html" class="btn">🏠 Home</a>

    <a href="#" class="btn">👥 Find People</a>

    <a href="#" class="btn">✏️ Edit Profile</a>

    <button class="btn logout">🚪 Logout</button>

  </div>

</body>
</html>
