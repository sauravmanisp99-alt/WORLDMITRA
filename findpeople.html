<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find People - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8ff;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 25px auto;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .search-box h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .search-box p {
      color: #667085;
      margin-bottom: 15px;
    }

    .search-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: #2563eb;
    }

    .user-card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 15px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.07);
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .user-info {
      flex: 1;
    }

    .user-info h2 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .country {
      color: #667085;
      font-size: 14px;
    }

    .bio {
      color: #555;
      line-height: 1.5;
      margin-top: 12px;
    }

    .interests {
      background: #eef4ff;
      padding: 10px;
      border-radius: 9px;
      margin-top: 10px;
      color: #333;
      font-size: 14px;
      line-height: 1.4;
    }

    /* ACTION BUTTONS */

    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-top: 15px;
    }

    .action-btn {
      border: none;
      color: white;
      padding: 12px 8px;
      border-radius: 9px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .profile-btn {
      background: #111827;
    }

    .chat-btn {
      background: #2563eb;
    }

    .voice-btn {
      background: #16a34a;
    }

    .video-btn {
      background: #7c3aed;
    }

    .empty {
      text-align: center;
      color: #667085;
      padding: 30px;
      background: white;
      border-radius: 15px;
    }

    .home-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      margin-top: 20px;
      padding: 13px;
      background: #111827;
      color: white;
      border-radius: 10px;
      font-weight: bold;
    }

    @media (max-width: 650px) {

      .actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .action-btn {
        width: 100%;
      }

    }

    @media (max-width: 400px) {

      .actions {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

  <div class="header">
    🌍 WorldMitra
  </div>

  <div class="container">

    <div class="search-box">

      <h1>👥 Find People</h1>

      <p>
        Discover people from around the world and connect directly.
      </p>

      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search by name, country or interests..."
      >

    </div>


    <div id="usersList">

      <div class="empty">
        Loading people...
      </div>

    </div>


    <a href="profile.html" class="home-btn">
      ← Back to Profile
    </a>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // ----------------------------------
    // FIREBASE CONFIG
    // ----------------------------------

    const firebaseConfig = {

      apiKey:
        "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",

      authDomain:
        "worldmitra-33ca6.firebaseapp.com",

      projectId:
        "worldmitra-33ca6",

      storageBucket:
        "worldmitra-33ca6.firebasestorage.app",

      messagingSenderId:
        "1089520845776",

      appId:
        "1:1089520845776:web:2789654cc6061e7034afd5"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // ----------------------------------
    // ELEMENTS
    // ----------------------------------

    const usersList =
      document.getElementById(
        "usersList"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );


    let allUsers = [];

    let currentUser = null;


    // ----------------------------------
    // LOAD USERS
    // ----------------------------------

    async function loadUsers() {

      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "users"
            )
          );


        allUsers = [];


        snapshot.forEach(
          (userDoc) => {

            const data =
              userDoc.data();


            allUsers.push({

              ...data,

              uid:
                data.uid ||
                userDoc.id

            });

          }
        );


        showUsers(
          allUsers
        );


      } catch (error) {

        console.error(
          "Users load error:",
          error
        );


        usersList.innerHTML = `

          <div class="empty">

            People load नहीं हो पाए।

            <br><br>

            ${error.message}

          </div>

        `;

      }

    }


    // ----------------------------------
    // CREATE USER CARD
    // ----------------------------------

    function createUserCard(user) {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "user-card";


      // TOP ROW

      const topRow =
        document.createElement(
          "div"
        );

      topRow.className =
        "top-row";


      // AVATAR

      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "avatar";


      if (user.profileImage) {

        const image =
          document.createElement(
            "img"
          );

        image.src =
          user.profileImage;

        image.alt =
          "Profile Photo";

        avatar.appendChild(
          image
        );

      } else {

        avatar.textContent =
          (
            user.name ||
            "U"
          )
          .charAt(0)
          .toUpperCase();

      }


      // USER INFO

      const userInfo =
        document.createElement(
          "div"
        );

      userInfo.className =
        "user-info";


      const name =
        document.createElement(
          "h2"
        );

      name.textContent =
        user.name ||
        "WorldMitra User";


      const country =
        document.createElement(
          "div"
        );

      country.className =
        "country";

      country.textContent =
        "🌎 " +
        (
          user.country ||
          "Country not available"
        );


      userInfo.appendChild(
        name
      );

      userInfo.appendChild(
        country
      );


      topRow.appendChild(
        avatar
      );

      topRow.appendChild(
        userInfo
      );


      // BIO

      const bio =
        document.createElement(
          "div"
        );

      bio.className =
        "bio";

      bio.textContent =
        "📝 " +
        (
          user.bio ||
          "No information added yet."
        );


      // INTERESTS

      const interests =
        document.createElement(
          "div"
        );

      interests.className =
        "interests";

      interests.textContent =
        "❤️ " +
        (
          user.interests ||
          "Interests not added yet."
        );


      // ----------------------------------
      // ACTION BUTTONS
      // ----------------------------------

      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "actions";


      // PROFILE

      const profileButton =
        document.createElement(
          "a"
        );

      profileButton.className =
        "action-btn profile-btn";

      profileButton.textContent =
        "👤 Profile";

      profileButton.href =
        "user-profile.html?uid=" +
        encodeURIComponent(
          user.uid
        );


      // CHAT

      const chatButton =
        document.createElement(
          "a"
        );

      chatButton.className =
        "action-btn chat-btn";

      chatButton.textContent =
        "💬 Chat";

      chatButton.href =
        "chat.html?uid=" +
        encodeURIComponent(
          user.uid
        ) +
        "&name=" +
        encodeURIComponent(
          user.name ||
          "WorldMitra User"
        );


      // VOICE CALL
      // IMPORTANT: actual file is call.html

      const voiceButton =
        document.createElement(
          "a"
        );

      voiceButton.className =
        "action-btn voice-btn";

      voiceButton.textContent =
        "📞 Voice Call";

      voiceButton.href =
        "call.html?uid=" +
        encodeURIComponent(
          user.uid
        ) +
        "&name=" +
        encodeURIComponent(
          user.name ||
          "WorldMitra User"
        );


      // VIDEO CALL

      const videoButton =
        document.createElement(
          "a"
        );

      videoButton.className =
        "action-btn video-btn";

      videoButton.textContent =
        "📹 Video Call";

      videoButton.href =
        "video-call.html?uid=" +
        encodeURIComponent(
          user.uid
        ) +
        "&name=" +
        encodeURIComponent(
          user.name ||
          "WorldMitra User"
        );


      // ADD BUTTONS

      actions.appendChild(
        profileButton
      );

      actions.appendChild(
        chatButton
      );

      actions.appendChild(
        voiceButton
      );

      actions.appendChild(
        videoButton
      );


      // ADD CONTENT

      card.appendChild(
        topRow
      );

      card.appendChild(
        bio
      );

      card.appendChild(
        interests
      );

      card.appendChild(
        actions
      );


      return card;

    }


    // ----------------------------------
    // SHOW USERS
    // ----------------------------------

    function showUsers(users) {

      usersList.innerHTML =
        "";


      const otherUsers =
        users.filter(
          (user) =>
            user.uid !==
            currentUser.uid
        );


      if (
        otherUsers.length === 0
      ) {

        usersList.innerHTML = `

          <div class="empty">

            No other people found yet. 🌍

          </div>

        `;

        return;

      }


      otherUsers.forEach(
        (user) => {

          const card =
            createUserCard(
              user
            );

          usersList.appendChild(
            card
          );

        }
      );

    }


    // ----------------------------------
    // SEARCH
    // ----------------------------------

    searchInput.addEventListener(
      "input",
      () => {

        const search =
          searchInput.value
            .toLowerCase()
            .trim();


        const filteredUsers =
          allUsers.filter(
            (user) => {

              const name =
                (
                  user.name ||
                  ""
                )
                .toLowerCase();


              const country =
                (
                  user.country ||
                  ""
                )
                .toLowerCase();


              const bio =
                (
                  user.bio ||
                  ""
                )
                .toLowerCase();


              const interests =
                (
                  user.interests ||
                  ""
                )
                .toLowerCase();


              return (

                name.includes(
                  search
                ) ||

                country.includes(
                  search
                ) ||

                bio.includes(
                  search
                ) ||

                interests.includes(
                  search
                )

              );

            }
          );


        showUsers(
          filteredUsers
        );

      }
    );


    // ----------------------------------
    // AUTHENTICATION
    // ----------------------------------

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser =
          user;


        await loadUsers();

      }
    );

  </script>

</body>
</html>
