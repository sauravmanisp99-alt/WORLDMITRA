<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #e5ddd5;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* Main Chat */
    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: #efeae2;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header */
    .chat-header {
      height: 65px;
      background: #4f46e5;
      color: white;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 12px;
      flex-shrink: 0;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 28px;
      width: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-avatar {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: white;
      color: #4f46e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 19px;
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .user-name {
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    .online-status {
      font-size: 12px;
      margin-top: 3px;
    }

    .online {
      color: #b7ffca;
    }

    .offline {
      color: #e5e7eb;
    }

    /* Messages Area */
    .messages {
      flex: 1;
      padding: 15px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;

      background-color: #efeae2;

      /* Simple chat pattern */
      background-image:
        radial-gradient(
          rgba(0,0,0,0.035) 1px,
          transparent 1px
        );
      background-size: 18px 18px;
    }

    /* Message Row */
    .message-wrapper {
      display: flex;
      width: 100%;
    }

    .message-wrapper.sent-wrapper {
      justify-content: flex-end;
    }

    .message-wrapper.received-wrapper {
      justify-content: flex-start;
    }

    /* Message Bubble */
    .message {
      max-width: 78%;
      padding: 9px 12px;
      border-radius: 10px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.4;
      position: relative;
      box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    }

    .sent {
      background: #d9fdd3;
      color: #111827;
      border-top-right-radius: 3px;
    }

    .received {
      background: white;
      color: #111827;
      border-top-left-radius: 3px;
    }

    /* Delete Button */
    .delete-btn {
      border: none;
      background: transparent;
      color: #777;
      font-size: 13px;
      cursor: pointer;
      margin-top: 5px;
      padding: 2px 4px;
      display: block;
      margin-left: auto;
    }

    .delete-btn:hover {
      color: #dc2626;
    }

    /* Input Area */
    .input-area {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px;
      background: #f0f2f5;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
    }

    .message-input-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: white;
      border-radius: 25px;
      padding: 0 15px;
      min-width: 0;
    }

    .message-input-box input {
      width: 100%;
      border: none;
      outline: none;
      padding: 12px 0;
      font-size: 15px;
      background: transparent;
    }

    .send-btn {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      background: #4f46e5;
      color: white;
      font-size: 19px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-btn:active {
      transform: scale(0.94);
    }

    /* Mobile */
    @media (max-width: 600px) {

      .chat-container {
        max-width: 100%;
      }

      .chat-header {
        height: 62px;
        padding: 7px 9px;
      }

      .user-avatar {
        width: 40px;
        height: 40px;
        font-size: 17px;
      }

      .user-name {
        font-size: 16px;
        max-width: 220px;
      }

      .messages {
        padding: 12px 7px;
      }

      .message {
        max-width: 82%;
        font-size: 15px;
      }

      .input-area {
        padding: 7px;
      }

      .send-btn {
        width: 44px;
        height: 44px;
      }
    }

    /* Very small phones */
    @media (max-width: 360px) {

      .user-name {
        max-width: 170px;
      }

      .message {
        max-width: 88%;
      }

    }

  </style>
</head>

<body>

  <div class="chat-container">

    <!-- Header -->
    <div class="chat-header">

      <a href="connections.html" class="back-btn">←</a>

      <div class="user-avatar" id="userAvatar">
        W
      </div>

      <div class="user-info">

        <div class="user-name" id="otherUserName">
          Loading...
        </div>

        <span
          class="online-status offline"
          id="onlineStatus"
        >
          ⚪ Offline
        </span>

      </div>

    </div>


    <!-- Messages -->
    <div
      class="messages"
      id="messages"
    >

      <div
        style="
          text-align:center;
          color:#777;
          margin-top:20px;
        "
      >
        Loading messages...
      </div>

    </div>


    <!-- Message Input -->
    <div class="input-area">

      <div class="message-input-box">

        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
          autocomplete="off"
        >

      </div>

      <button
        class="send-btn"
        id="sendBtn"
      >
        ➤
      </button>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      addDoc,
      deleteDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* Firebase */

    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    /* Elements */

    const otherUserNameElement =
      document.getElementById(
        "otherUserName"
      );

    const userAvatar =
      document.getElementById(
        "userAvatar"
      );

    const onlineStatus =
      document.getElementById(
        "onlineStatus"
      );

    const messagesContainer =
      document.getElementById(
        "messages"
      );

    const messageInput =
      document.getElementById(
        "messageInput"
      );

    const sendBtn =
      document.getElementById(
        "sendBtn"
      );


    let currentUser = null;
    let otherUserId = null;
    let otherUserName = null;


    /* Chat ID */

    function getChatId(
      userA,
      userB
    ) {

      return [
        userA,
        userB
      ]
      .sort()
      .join("_");

    }


    /* Online / Offline */

    function updateOnlineStatus(
      data
    ) {

      if (
        data.online === true
      ) {

        onlineStatus.textContent =
          "🟢 Online";

        onlineStatus.className =
          "online-status online";

      } else {

        onlineStatus.textContent =
          "⚪ Offline";

        onlineStatus.className =
          "online-status offline";

      }

    }


    /* Listen to other user */

    function listenToOtherUserStatus() {

      if (!otherUserId) return;

      const userRef =
        doc(
          db,
          "users",
          otherUserId
        );


      onSnapshot(
        userRef,
        (snapshot) => {

          if (
            snapshot.exists()
          ) {

            updateOnlineStatus(
              snapshot.data()
            );

          } else {

            onlineStatus.textContent =
              "⚪ Offline";

          }

        }
      );

    }


    /* Current user Online */

    async function setOnline() {

      if (!currentUser) return;

      try {

        await updateDoc(
          doc(
            db,
            "users",
            currentUser.uid
          ),
          {
            online: true,
            lastSeen: serverTimestamp()
          }
        );

      } catch (error) {

        console.error(
          "Online status error:",
          error
        );

      }

    }


    /* Current user Offline */

    async function setOffline() {

      if (!currentUser) return;

      try {

        await updateDoc(
          doc(
            db,
            "users",
            currentUser.uid
          ),
          {
            online: false,
            lastSeen: serverTimestamp()
          }
        );

      } catch (error) {

        console.error(
          "Offline status error:",
          error
        );

      }

    }


    /* Load Profile */

    async function loadOtherUserProfile() {

      if (!otherUserId) return;

      try {

        const userDoc =
          await getDoc(
            doc(
              db,
              "users",
              otherUserId
            )
          );


        if (
          userDoc.exists()
        ) {

          const data =
            userDoc.data();


          otherUserName =
            data.name ||
            otherUserName ||
            "WorldMitra User";


          otherUserNameElement.textContent =
            otherUserName;


          /* Avatar */

          userAvatar.textContent =
            otherUserName
              .charAt(0)
              .toUpperCase();

        }

      } catch (error) {

        console.error(
          "Profile loading error:",
          error
        );

      }

    }


    /* Delete Message */

    async function deleteMessage(
      messageId
    ) {

      if (
        !currentUser ||
        !otherUserId
      ) return;


      const confirmDelete =
        confirm(
          "Delete this message?"
        );


      if (!confirmDelete) return;


      const chatId =
        getChatId(
          currentUser.uid,
          otherUserId
        );


      try {

        await deleteDoc(
          doc(
            db,
            "chats",
            chatId,
            "messages",
            messageId
          )
        );

      } catch (error) {

        console.error(
          "Delete message error:",
          error
        );

        alert(
          "Message delete nahi hua."
        );

      }

    }


    /* Load Messages */

    function loadMessages() {

      if (
        !currentUser ||
        !otherUserId
      ) return;


      const chatId =
        getChatId(
          currentUser.uid,
          otherUserId
        );


      const messagesRef =
        collection(
          db,
          "chats",
          chatId,
          "messages"
        );


      const messagesQuery =
        query(
          messagesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        );


      onSnapshot(
        messagesQuery,
        (snapshot) => {

          messagesContainer.innerHTML =
            "";


          snapshot.forEach(
            (messageDoc) => {

              const data =
                messageDoc.data();


              const wrapper =
                document.createElement(
                  "div"
                );


              wrapper.classList.add(
                "message-wrapper"
              );


              const messageDiv =
                document.createElement(
                  "div"
                );


              messageDiv.classList.add(
                "message"
              );


              /* Sent */

              if (
                data.senderId ===
                currentUser.uid
              ) {

                wrapper.classList.add(
                  "sent-wrapper"
                );

                messageDiv.classList.add(
                  "sent"
                );

              }

              /* Received */

              else {

                wrapper.classList.add(
                  "received-wrapper"
                );

                messageDiv.classList.add(
                  "received"
                );

              }


              /* Message text */

              const textElement =
                document.createElement(
                  "div"
                );

              textElement.textContent =
                data.text || "";


              messageDiv.appendChild(
                textElement
              );


              /* Delete button only for own messages */

              if (
                data.senderId ===
                currentUser.uid
              ) {

                const deleteButton =
                  document.createElement(
                    "button"
                  );


                deleteButton.className =
                  "delete-btn";


                deleteButton.textContent =
                  "🗑️ Delete";


                deleteButton.addEventListener(
                  "click",
                  () => {

                    deleteMessage(
                      messageDoc.id
                    );

                  }
                );


                messageDiv.appendChild(
                  deleteButton
                );

              }


              wrapper.appendChild(
                messageDiv
              );


              messagesContainer.appendChild(
                wrapper
              );

            }
          );


          messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

        },


        (error) => {

          console.error(
            "Messages loading error:",
            error
          );


          messagesContainer.innerHTML =
            `
              <div
                style="
                  text-align:center;
                  color:red;
                  margin-top:20px;
                "
              >
                Unable to load messages
              </div>
            `;

        }

      );

    }


    /* Send Message */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (
        !text ||
        !currentUser ||
        !otherUserId
      ) {

        return;

      }


      const chatId =
        getChatId(
          currentUser.uid,
          otherUserId
        );


      try {

        await addDoc(
          collection(
            db,
            "chats",
            chatId,
            "messages"
          ),
          {

            senderId:
              currentUser.uid,

            receiverId:
              otherUserId,

            text:
              text,

            createdAt:
              serverTimestamp()

          }
        );


        messageInput.value =
          "";

        messageInput.focus();


      } catch (error) {

        console.error(
          "Message sending error:",
          error
        );


        alert(
          "Message send nahi hua."
        );

      }

    }


    /* Send button */

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /* Enter key */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* Authentication */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser =
          user;


        /* Set Online */

        await setOnline();


        /* Set Offline when leaving */

        window.addEventListener(
          "beforeunload",
          setOffline
        );


        /* URL Parameters */

        const params =
          new URLSearchParams(
            window.location.search
          );


        otherUserId =
          params.get("uid");


        otherUserName =
          params.get("name");


        if (!otherUserId) {

          alert(
            "User information not found."
          );

          return;

        }


        otherUserNameElement.textContent =
          otherUserName ||
          "WorldMitra User";


        userAvatar.textContent =
          (
            otherUserName ||
            "W"
          )
          .charAt(0)
          .toUpperCase();


        /* Load profile */

        await loadOtherUserProfile();


        /* Online / Offline */

        listenToOtherUserStatus();


        /* Messages */

        loadMessages();

      }
    );

  </script>

</body>
</html>
