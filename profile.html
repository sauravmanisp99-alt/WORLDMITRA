<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - WorldMitra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f8ff;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .profile-card {
      width: 92%;
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 30px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .email {
      color: #667085;
      margin-bottom: 20px;
    }

    .bio {
      color: #555;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .logout {
      background: #e53935;
    }
  </style>
</head>

<body>

  <div class="header">
    🌍 WorldMitra
  </div>

  <div class="profile-card">

    <div class="avatar">W</div>

    <h1 id="userName">My Profile</h1>

    <p class="email" id="userEmail">
      Loading...
    </p>

    <p class="bio">
      Welcome to WorldMitra! Connect with people,
      make new friends and discover the world.
    </p>

    <a href="index.html" class="btn">
      🏠 Home
    </a>

    <a href="findpeople.html" class="btn">
      👥 Find People
    </a>

    <a href="#" class="btn">
      ✏️ Edit Profile
    </a>

    <button id="logoutBtn" class="btn logout">
      🚪 Logout
    </button>

  </div>

  <script type="module">

    import { initializeApp } 
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {

      if (user) {
        document.getElementById("userEmail").textContent = user.email;
      } else {
        window.location.href = "login.html";
      }

    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {

      await signOut(auth);

      window.location.href = "login.html";

    });

  </script>

</body>
</html>
