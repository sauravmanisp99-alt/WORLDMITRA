<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Chat - WorldMitra</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #e5ddd5;
    }

    /* MAIN CHAT */
    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 100dvh;
      margin: 0 auto;
      background: #efeae2;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* HEADER */
    .chat-header {
      height: 64px;
      min-height: 64px;
      background: #4f46e5;
      color: white;
      display: flex;
      align-items: center;
      padding: 7px 10px;
      gap: 10px;
      flex-shrink: 0;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 28px;
      width: 34px;
      min-width: 34px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-avatar {
      width: 42px;
      min-width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      color: #4f46e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .user-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .user-name {
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .online-status {
      font-size: 12px;
      margin-top: 3px;
    }

    .online {
      color: #b7ffca;
    }

    .offline {
      color: #e5e7eb;
    }

    /* CALL BUTTONS */
    .call-buttons {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .call-btn {
      width: 40px;
      min-width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .call-btn:hover {
      background: rgba(255, 255, 255, 0.30);
    }

    .call-btn:active {
      transform: scale(0.92);
    }

    /* MESSAGES */
    .messages {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 12px 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      background-color: #efeae2;

      background-image:
        radial-gradient(
          rgba(0,0,0,0.035) 1px,
          transparent 1px
        );

      background-size: 18px 18px;
    }

    .message-wrapper {
      width: 100%;
      display: flex;
    }

    .sent-wrapper {
      justify-content: flex-end;
    }

    .received-wrapper {
      justify-content: flex-start;
    }

    .message {
      max-width: 78%;
      padding: 9px 11px;
      border-radius: 10px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.4;
      box-shadow: 0 1px 1px rgba(0,0,0,0.08);
    }

    .sent {
      background: #d9fdd3;
      color: #111827;
      border-top-right-radius: 3px;
    }

    .received {
      background: white;
      color: #111827;
      border-top-left-radius: 3px;
    }

    /* DELETE */
    .delete-btn {
      display: block;
      border: none;
      background: transparent;
      color: #777;
      font-size: 12px;
      cursor: pointer;
      margin-left: auto;
      margin-top: 5px;
      padding: 2px 3px;
    }

    .delete-btn:hover {
      color: #dc2626;
    }

    /* INPUT AREA */
    .input-area {
      width: 100%;
      min-height: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px;
      background: #f0f2f5;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
      position: relative;
      z-index: 20;
    }

    /* MESSAGE INPUT */
    #messageInput {
      flex: 1;
      width: 100%;
      min-width: 0;
      height: 46px;
      border: 1px solid #ddd;
      outline: none;
      background: white;
      border-radius: 24px;
      padding: 0 16px;
      font-size: 15px;
      color: #111827;
      display: block;
    }

    #messageInput:focus {
      border-color: #4f46e5;
    }

    #messageInput::placeholder {
      color: #777;
    }

    /* SEND BUTTON */
    .send-btn {
      width: 46px;
      min-width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: #4f46e5;
      color: white;
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .send-btn:active {
      transform: scale(0.94);
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .chat-container {
        max-width: 100%;
      }

      .chat-header {
        height: 62px;
        min-height: 62px;
        padding: 6px 8px;
        gap: 7px;
      }

      .back-btn {
        width: 30px;
        min-width: 30px;
      }

      .user-avatar {
        width: 40px;
        min-width: 40px;
        height: 40px;
      }

      .user-name {
        font-size: 16px;
      }

      .call-buttons {
        gap: 3px;
      }

      .call-btn {
        width: 37px;
        min-width: 37px;
        height: 37px;
        font-size: 18px;
      }

      .messages {
        padding: 10px 6px;
      }

      .message {
        max-width: 84%;
        font-size: 15px;
      }

      .input-area {
        height: 60px;
        min-height: 60px;
        padding: 7px;
      }

      #messageInput {
        height: 44px;
        font-size: 15px;
      }

      .send-btn {
        width: 44px;
        min-width: 44px;
        height: 44px;
      }
    }

    /* SMALL PHONES */
    @media (max-width: 360px) {

      .message {
        max-width: 88%;
      }

      .user-name {
        max-width: 140px;
      }

      .call-btn {
        width: 34px;
        min-width: 34px;
        height: 34px;
        font-size: 17px;
      }

    }

  </style></head><body>  <div class="chat-container"><!-- HEADER -->
<div class="chat-header">

  <a
    href="connections.html"
    class="back-btn"
  >
    ←
  </a>

  <div
    class="user-avatar"
    id="userAvatar"
  >
    W
  </div>

  <div class="user-info">

    <div
      class="user-name"
      id="otherUserName"
    >
      Loading...
    </div>

    <span
      class="online-status offline"
      id="onlineStatus"
    >
      ⚪ Offline
    </span>

  </div>


  <!-- VOICE + VIDEO CALL -->
  <div class="call-buttons">

    <a
      href="#"
      class="call-btn"
      id="voiceCallBtn"
      title="Voice Call"
      aria-label="Voice Call"
    >
      📞
    </a>

    <a
      href="#"
      class="call-btn"
      id="videoCallBtn"
      title="Video Call"
      aria-label="Video Call"
    >
      📹
    </a>

  </div>

</div>


<!-- MESSAGES -->
<div
  class="messages"
  id="messages"
>

  <div
    style="
      text-align:center;
      color:#777;
      margin-top:20px;
    "
  >
    Loading messages...
  </div>

</div>


<!-- MESSAGE INPUT -->
<div class="input-area">

  <input
    type="text"
    id="messageInput"
    placeholder="Type a message..."
    autocomplete="off"
  >

  <button
    type="button"
    class="send-btn"
    id="sendBtn"
  >
    ➤
  </button>

</div>

  </div>  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      addDoc,
      deleteDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* FIREBASE */

    const firebaseConfig = {
      apiKey: "AIzaSyBAhtPH_elsDDkBsxZsvMO8FYwdOGna84g",
      authDomain: "worldmitra-33ca6.firebaseapp.com",
      projectId: "worldmitra-33ca6",
      storageBucket: "worldmitra-33ca6.firebasestorage.app",
      messagingSenderId: "1089520845776",
      appId: "1:1089520845776:web:2789654cc6061e7034afd5"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    /* ELEMENTS */

    const otherUserNameElement =
      document.getElementById(
        "otherUserName"
      );

    const userAvatar =
      document.getElementById(
        "userAvatar"
      );

    const onlineStatus =
      document.getElementById(
        "onlineStatus"
      );

    const messagesContainer =
      document.getElementById(
        "messages"
      );

    const messageInput =
      document.getElementById(
        "messageInput"
      );

    const sendBtn =
      document.getElementById(
        "sendBtn"
      );


    /* CALL BUTTON ELEMENTS */

    const voiceCallBtn =
      document.getElementById(
        "voiceCallBtn"
      );

    const videoCallBtn =
      document.getElementById(
        "videoCallBtn"
      );


    let currentUser = null;
    let otherUserId = null;
    let otherUserName = null;


    /* CHAT ID */

    function getChatId(
      userA,
      userB
    ) {

      return [
        userA,
        userB
      ]
      .sort()
      .join("_");

    }


    /* CALL LINKS */

    function updateCallLinks() {

      if (!otherUserId) {
        return;
      }

      const name =
        otherUserName ||
        "WorldMitra User";


      voiceCallBtn.href =
        "call.html?uid=" +
        encodeURIComponent(
          otherUserId
        ) +
        "&name=" +
        encodeURIComponent(
          name
        );


      videoCallBtn.href =
        "video-call.html?uid=" +
        encodeURIComponent(
          otherUserId
        ) +
        "&name=" +
        encodeURIComponent(
          name
        );

    }


    /* ONLINE / OFFLINE */

    function updateOnlineStatus(
      data
    ) {

      if (
        data.online === true
      ) {

        onlineStatus.textContent =
          "🟢 Online";

        onlineStatus.className =
          "online-status online";

      } else {

        onlineStatus.textContent =
          "⚪ Offline";

        onlineStatus.className =
          "online-status offline";

      }

    }


    /* LISTEN TO USER STATUS */

    function listenToOtherUserStatus() {

      if (!otherUserId) return;

      const userRef =
        doc(
          db,
          "users",
          otherUserId
        );


      onSnapshot(
        userRef,
        (snapshot) => {

          if (
            snapshot.exists()
          ) {

            updateOnlineStatus(
              snapshot.data()
            );

          } else {

            onlineStatus.textContent =
              "⚪ Offline";

          }

        },
        (error) => {

          console.error(
            "Status error:",
            error
          );

          onlineStatus.textContent =
            "⚪ Offline";

        }
      );

    }


    /* CURRENT USER ONLINE */

    async function setOnline() {

      if (!currentUser) return;

      try {

        await updateDoc(
          doc(
            db,
            "users",
            currentUser.uid
          ),
          {
            online: true,
            lastSeen: serverTimestamp()
          }
        );

      } catch (error) {

        console.error(
          "Online status error:",
          error
        );

      }

    }


    /* CURRENT USER OFFLINE */

    async function setOffline() {

      if (!currentUser) return;

      try {

        await updateDoc(
          doc(
            db,
            "users",
            currentUser.uid
          ),
          {
            online: false,
            lastSeen: serverTimestamp()
          }
        );

      } catch (error) {

        console.error(
          "Offline status error:",
          error
        );

      }

    }


    /* LOAD PROFILE */

    async function loadOtherUserProfile() {

      if (!otherUserId) return;

      try {

        const userDoc =
          await getDoc(
            doc(
              db,
              "users",
              otherUserId
            )
          );


        if (
          userDoc.exists()
        ) {

          const data =
            userDoc.data();


          otherUserName =
            data.name ||
            otherUserName ||
            "WorldMitra User";


          otherUserNameElement.textContent =
            otherUserName;


          userAvatar.textContent =
            otherUserName
              .charAt(0)
              .toUpperCase();


          /* UPDATE CALL LINKS AFTER PROFILE LOAD */

          updateCallLinks();

        }

      } catch (error) {

        console.error(
          "Profile loading error:",
          error
        );

      }

    }


    /* DELETE MESSAGE */

    async function deleteMessage(
      messageId
    ) {

      if (
        !currentUser ||
        !otherUserId
      ) return;


      const confirmDelete =
        confirm(
          "Delete this message?"
        );


      if (!confirmDelete) return;


      const chatId =
        getChatId(
          currentUser.uid,
          otherUserId
        );


      try {

        await deleteDoc(
          doc(
            db,
            "chats",
            chatId,
            "messages",
            messageId
          )
        );

      } catch (error) {

        console.error(
          "Delete message error:",
          error
        );

        alert(
          "Message delete nahi hua."
        );

      }

    }


    /* LOAD MESSAGES */

    function loadMessages() {

      if (
        !currentUser ||
        !otherUserId
      ) return;


      const chatId =
        getChatId(
          currentUser.uid,
          otherUserId
        );


      const messagesRef =
        collection(
          db,
          "chats",
          chatId,
          "messages"
        );


      const messagesQuery =
        query(
          messagesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        );


      onSnapshot(
        messagesQuery,
        (snapshot) => {

          messagesContainer.innerHTML =
            "";


          snapshot.forEach(
            (messageDoc) => {

              const data =
                messageDoc.data();


              const wrapper =
                document.createElement(
                  "div"
                );


              wrapper.className =
                "message-wrapper";


              const messageDiv =
                document.createElement(
                  "div"
                );


              messageDiv.className =
                "message";


              /* SENT */

              if (
                data.senderId ===
                currentUser.uid
              ) {

                wrapper.classList.add(
                  "sent-wrapper"
                );

                messageDiv.classList.add(
                  "sent"
                );

              }

              /* RECEIVED */

              else {

                wrapper.classList.add(
                  "received-wrapper"
                );

                messageDiv.classList.add(
                  "received"
                );

              }


              /* TEXT */

              const textElement =
                document.createElement(
                  "div"
                );

              textElement.textContent =
                data.text || "";


              messageDiv.appendChild(
                textElement
              );


              /* DELETE ONLY OWN MESSAGE */

              if (
                data.senderId ===
                currentUser.uid
              ) {

                const deleteButton =
                  document.createElement(
                    "button"
                  );


                deleteButton.type =
                  "button";


                deleteButton.className =
                  "delete-btn";


                deleteButton.textContent =
                  "🗑️ Delete";


                deleteButton.addEventListener(
                  "click",
                  () => {

                    deleteMessage(
                      messageDoc.id
                    );

                  }
                );


                messageDiv.appendChild(
                  deleteButton
                );

              }


              wrapper.appendChild(
                messageDiv
              );


              messagesContainer.appendChild(
                wrapper
              );

            }
          );


          messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

        },


        (error) => {

          console.error(
            "Messages loading error:",
            error
          );


          messagesContainer.innerHTML =
            `
              <div
                style="
                  text-align:center;
                  color:red;
                  margin-top:20px;
                "
              >
                Unable to load messages
              </div>
            `;

        }

      );

    }


    /* SEND MESSAGE */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (
        !text ||
        !currentUser ||
        !otherUserId
      ) {

        return;

      }


      const chatId =
        getChatId(
          currentUser.uid,
          otherUserId
        );


      try {

        await addDoc(
          collection(
            db,
            "chats",
            chatId,
            "messages"
          ),
          {
            senderId:
              currentUser.uid,

            receiverId:
              otherUserId,

            text:
              text,

            createdAt:
              serverTimestamp()
          }
        );


        messageInput.value =
          "";

        messageInput.focus();

      } catch (error) {

        console.error(
          "Message sending error:",
          error
        );

        alert(
          "Message send nahi hua."
        );

      }

    }


    /* SEND BUTTON */

    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /* ENTER TO SEND */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* AUTH */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser =
          user;


        /* GET URL DATA FIRST */

        const params =
          new URLSearchParams(
            window.location.search
          );


        otherUserId =
          params.get("uid");


        otherUserName =
          params.get("name");


        if (!otherUserId) {

          alert(
            "User information not found."
          );

          return;

        }


        /* SHOW NAME IMMEDIATELY */

        otherUserNameElement.textContent =
          otherUserName ||
          "WorldMitra User";


        userAvatar.textContent =
          (
            otherUserName ||
            "W"
          )
          .charAt(0)
          .toUpperCase()


        /* SET CALL LINKS IMMEDIATELY */

        updateCallLinks();
        /* SET ONLINE */

        await setOnline();


        /* OFFLINE WHEN LEAVING */

        window.addEventListener(
          "beforeunload",
          setOffline
        );


        /* PROFILE */

        await loadOtherUserProfile();


        /* STATUS */

        listenToOtherUserStatus();


        /* MESSAGES */

        loadMessages();

      }
    );

  </script>

</body>
</html>
